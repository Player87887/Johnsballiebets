<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Value Radar — Bets kiezen</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c232d; --line:#29313c; --line-soft:#202832;
    --ink:#e6edf3; --ink-dim:#8b96a5; --ink-faint:#5b6675;
    --signal:#29e0a0; --warn:#f0a24b; --neg:#e0556b;
    --mono:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; line-height:1.5; padding-bottom:120px; }

  header { border-bottom:1px solid var(--line); padding:28px 24px 22px; max-width:1080px; margin:0 auto; }
  .brand { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .brand h1 { font-size:26px; font-weight:800; letter-spacing:-0.5px; }
  .brand .sub { color:var(--signal); font-family:var(--mono); font-size:13px; font-weight:600; }
  .tagline { color:var(--ink-dim); font-size:13.5px; margin-top:6px; max-width:640px; }
  .meta-row { display:flex; gap:20px; margin-top:16px; flex-wrap:wrap; align-items:center; font-family:var(--mono); font-size:12px; color:var(--ink-faint); }
  .meta-row b { color:var(--ink-dim); font-weight:500; }
  .load-btn { display:inline-flex; align-items:center; gap:8px; background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--sans); }
  .load-btn:hover { border-color:var(--signal); color:var(--signal); }

  nav.tabs { max-width:1080px; margin:0 auto; padding:18px 24px 0; display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line-soft); }
  .tab { background:none; border:none; cursor:pointer; color:var(--ink-dim); font-family:var(--sans); font-size:13.5px; font-weight:600; padding:10px 15px; border-bottom:2px solid transparent; display:flex; align-items:center; gap:8px; margin-bottom:-1px; }
  .tab:hover { color:var(--ink); }
  .tab.active { color:var(--ink); border-bottom-color:var(--signal); }
  .tab .cnt { font-family:var(--mono); font-size:11px; background:var(--panel-2); color:var(--ink-dim); padding:1px 7px; border-radius:10px; }
  .tab.active .cnt { background:var(--signal); color:#06231a; }

  main { max-width:1080px; margin:0 auto; padding:24px; }
  .match { background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:16px; overflow:hidden; }
  .match-head { display:flex; justify-content:space-between; align-items:flex-start; padding:16px 18px; gap:12px; }
  .teams { font-size:17px; font-weight:700; letter-spacing:-0.2px; }
  .teams .vs { color:var(--ink-faint); font-weight:400; margin:0 7px; }
  .match-sub { font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); margin-top:5px; display:flex; gap:14px; flex-wrap:wrap; }
  .match-sub .lam { color:var(--ink-dim); }
  .kickoff { text-align:right; font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); white-space:nowrap; }

  .warns { padding:0 18px 12px; display:flex; flex-direction:column; gap:4px; }
  .warn-chip { font-size:11.5px; color:var(--warn); display:flex; align-items:center; gap:7px; }
  .warn-chip::before { content:"▲"; font-size:9px; }

  .bets { border-top:1px solid var(--line-soft); }
  .bets-empty, .no-odds { padding:14px 18px; color:var(--ink-faint); font-size:12.5px; font-family:var(--mono); }
  .no-odds { border-top:1px solid var(--line-soft); }

  table { width:100%; border-collapse:collapse; }
  thead th { text-align:right; font-family:var(--mono); font-weight:500; font-size:10.5px; letter-spacing:0.4px; text-transform:uppercase; color:var(--ink-faint); padding:9px 18px 7px; border-bottom:1px solid var(--line-soft); }
  thead th.l { text-align:left; }
  tbody td { text-align:right; font-family:var(--mono); font-size:13px; padding:9px 18px; border-bottom:1px solid var(--line-soft); color:var(--ink); font-variant-numeric:tabular-nums; }
  tbody tr:last-child td { border-bottom:none; }
  tbody td.l { text-align:left; font-family:var(--sans); font-weight:600; font-size:13px; }
  tbody tr.off td:not(.pick) { opacity:0.35; }
  .mkt-type { display:inline-block; font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); background:var(--panel-2); padding:1px 6px; border-radius:4px; margin-right:8px; }
  .ev { color:var(--signal); font-weight:600; }
  .ev.ev-neg { color:var(--ink-faint); }
  .rec-star { color:var(--signal); font-size:11px; margin-left:6px; vertical-align:middle; }
  tbody tr.shown-only td.l { color:var(--ink-dim); }
  tbody tr.shown-only .mkt-type { opacity:0.7; }

  /* checkbox */
  td.pick { text-align:center; width:44px; }
  .cbox { width:18px; height:18px; border:1.5px solid var(--line); border-radius:5px; background:var(--panel-2); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; transition:all .12s; }
  .cbox.on { background:var(--signal); border-color:var(--signal); }
  .cbox.on::after { content:"✓"; color:#06231a; font-size:12px; font-weight:800; }

  /* stake input */
  .stake-in { width:58px; background:var(--panel-2); border:1px solid var(--line); border-radius:5px; color:var(--ink); font-family:var(--mono); font-size:12.5px; padding:4px 6px; text-align:right; }
  .stake-in:focus { outline:none; border-color:var(--signal); }
  .odd-in { width:64px; background:var(--panel-2); border:1px solid var(--line); border-radius:5px; color:var(--ink); font-family:var(--mono); font-size:12.5px; padding:4px 6px; text-align:right; }
  .odd-in:focus { outline:none; border-color:var(--signal); }
  tr.needs-odd .odd-in { border-color:var(--warn); border-style:dashed; }
  tr.needs-odd .odd-in::placeholder { color:var(--warn); }
  .fill-hint { color:var(--warn); font-size:11px; margin-left:6px; cursor:help; }
  .stake-euro { color:var(--ink-faint); margin-right:2px; }

  /* export bar */
  .exportbar { position:fixed; bottom:0; left:0; right:0; background:rgba(14,17,22,0.96); border-top:1px solid var(--line); backdrop-filter:blur(8px); }
  .exportbar-inner { max-width:1080px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .summary { font-family:var(--mono); font-size:12.5px; color:var(--ink-dim); }
  .summary b { color:var(--ink); }
  .summary .amt { color:var(--signal); }
  .export-btn { background:var(--signal); color:#06231a; border:none; border-radius:8px; padding:11px 22px; font-size:13.5px; font-weight:800; cursor:pointer; font-family:var(--sans); }
  .export-btn:disabled { opacity:0.4; cursor:not-allowed; }

  .empty { text-align:center; padding:70px 20px; color:var(--ink-dim); }
  .empty h2 { font-size:17px; margin-bottom:8px; color:var(--ink); font-weight:700; }
  .empty p { font-size:13.5px; max-width:440px; margin:0 auto 18px; }
  .empty code { font-family:var(--mono); font-size:12px; background:var(--panel-2); padding:2px 7px; border-radius:4px; color:var(--signal); }

  /* ── Uitklap: waarom deze λ's ────────────────────────────────────────── */
  details.why { border-top:1px solid var(--line-soft); }
  details.why > summary { list-style:none; cursor:pointer; padding:10px 18px; display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-dim); user-select:none; }
  details.why > summary::-webkit-details-marker { display:none; }
  details.why > summary::before { content:"›"; font-size:15px; line-height:1; color:var(--ink-faint); transition:transform .15s; width:10px; }
  details.why[open] > summary::before { transform:rotate(90deg); }
  details.why > summary:hover { color:var(--ink); }
  details.why > summary:focus-visible { outline:2px solid var(--signal); outline-offset:-2px; }
  .why-q { font-weight:600; color:var(--ink); white-space:nowrap; }
  .why-teaser { color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .why-body { padding:2px 18px 16px 38px; font-size:13px; }
  .why-head { font-weight:600; margin-bottom:10px; }
  .split { display:flex; height:22px; border-radius:5px; overflow:hidden; font-family:var(--mono); font-size:11px; font-weight:700; margin-bottom:4px; max-width:520px; }
  .split span { display:flex; align-items:center; padding:0 8px; white-space:nowrap; }
  .split .h { background:rgba(41,224,160,0.22); color:var(--signal); }
  .split .a { background:var(--panel-2); color:var(--ink-dim); justify-content:flex-end; }
  .split-cap { font-size:11px; color:var(--ink-faint); margin-bottom:10px; max-width:520px; display:flex; justify-content:space-between; }
  .why ul { list-style:none; display:flex; flex-direction:column; gap:5px; max-width:680px; }
  .why li { padding-left:14px; position:relative; color:var(--ink-dim); }
  .why li::before { content:""; position:absolute; left:2px; top:9px; width:4px; height:4px; border-radius:50%; background:var(--ink-faint); }
  .why li b { color:var(--ink); font-weight:600; }
  .why li.caution { color:var(--warn); }
  .why li.caution::before { background:var(--warn); }
  .fac { margin:0 0 12px; display:grid; gap:8px; max-width:680px; }
  .fac-team { font-size:12px; color:var(--ink-dim); }
  .fac-team .lam { font-family:var(--mono); color:var(--ink); font-weight:700; }
  .fac-chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }
  .fchip { font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:5px; background:var(--panel-2); color:var(--ink-dim); border:1px solid var(--line-soft); }
  .fchip.up { color:var(--signal); border-color:rgba(41,224,160,0.35); }
  .fchip.down { color:var(--neg); border-color:rgba(224,85,107,0.35); }
  .fchip.base { color:var(--ink-faint); }
  .why-note { font-size:11px; color:var(--ink-faint); margin-top:10px; max-width:680px; }
  .why-note code { font-family:var(--mono); font-size:10.5px; background:var(--panel-2); padding:1px 5px; border-radius:3px; color:var(--ink-dim); }
  @media (max-width:640px){ .why-body { padding-left:18px; } .why-teaser { display:none; } }
  .why li .up { color:var(--signal); font-family:var(--mono); font-size:12px; }
  .why li .down { color:var(--neg); font-family:var(--mono); font-size:12px; }
  .fref { color:var(--ink); border-bottom:1px dotted var(--ink-faint); cursor:help; }
  .fac { margin-top:12px; }

  /* ── Beslissingen-logboek: notitie per wedstrijd + batch-notitie ───────── */
  details.note { border-top:1px solid var(--line-soft); }
  details.note > summary { list-style:none; cursor:pointer; padding:10px 18px; display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-dim); user-select:none; }
  details.note > summary::-webkit-details-marker { display:none; }
  details.note > summary::before { content:"›"; font-size:15px; line-height:1; color:var(--ink-faint); transition:transform .15s; width:10px; }
  details.note[open] > summary::before { transform:rotate(90deg); }
  details.note > summary:hover { color:var(--ink); }
  .note-q { font-weight:600; color:var(--ink); white-space:nowrap; }
  .note-state { font-family:var(--mono); font-size:11px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .note-state.has { color:var(--signal); }
  .note-state .chg { color:var(--warn); }
  .note-body { padding:2px 18px 16px 38px; }
  .note-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .ntag { font-family:var(--mono); font-size:11px; padding:3px 9px; border-radius:5px; background:var(--panel-2); color:var(--ink-dim); border:1px solid var(--line-soft); cursor:pointer; user-select:none; }
  .ntag:hover { color:var(--ink); }
  .ntag.on { color:var(--signal); border-color:rgba(41,224,160,0.5); background:rgba(41,224,160,0.10); }
  .note-ta, .batch-ta { width:100%; max-width:680px; min-height:64px; resize:vertical; background:var(--panel-2); border:1px solid var(--line); border-radius:7px; color:var(--ink); font-family:var(--sans); font-size:13px; padding:9px 11px; line-height:1.45; }
  .note-ta:focus, .batch-ta:focus { outline:none; border-color:var(--signal); }
  .note-diff { font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-top:8px; max-width:680px; }
  .note-diff b { color:var(--warn); font-weight:600; }
  tr.changed td.l { box-shadow:inset 3px 0 0 var(--warn); }
  .batchnote { max-width:1080px; margin:0 auto; padding:16px 24px 0; }
  .batchnote label { display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:0.6px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px; }
  .batch-ta { min-height:48px; }
  .log-btn { background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:11px 16px; font-size:13px; font-weight:700; cursor:pointer; font-family:var(--sans); }
  .log-btn:hover { border-color:var(--signal); color:var(--signal); }
  .log-btn.small { padding:11px 12px; font-weight:600; color:var(--ink-faint); }
  .log-btn.small:hover { border-color:var(--neg); color:var(--neg); }
  .summary .chg { color:var(--warn); }
  @media (max-width:640px){ .note-body { padding-left:18px; } }
</style>
</head>
<body>
<!-- JB-NAV -->
<nav style="border-bottom:1px solid #29313c;background:#161b22;padding:0 24px;">
  <div style="max-width:1000px;margin:0 auto;display:flex;gap:2px;flex-wrap:wrap;align-items:center;font-family:'Inter',-apple-system,system-ui,sans-serif;">
    <a href="../" style="color:#5b6675;text-decoration:none;font-size:13.5px;font-weight:800;padding:13px 14px 13px 0;white-space:nowrap;">John's</a>
      <a href="../radar/" style="color:#29e0a0;text-decoration:none;font-size:13.5px;font-weight:600;padding:13px 15px;border-bottom:2px solid #29e0a0;white-space:nowrap;">Value Radar</a>
      <a href="../picks/" style="color:#8b96a5;text-decoration:none;font-size:13.5px;font-weight:600;padding:13px 15px;border-bottom:2px solid transparent;white-space:nowrap;">Picks</a>
      <a href="../beheer/" style="color:#8b96a5;text-decoration:none;font-size:13.5px;font-weight:600;padding:13px 15px;border-bottom:2px solid transparent;white-space:nowrap;">Beheer</a>
      <a href="../historie/" style="color:#8b96a5;text-decoration:none;font-size:13.5px;font-weight:600;padding:13px 15px;border-bottom:2px solid transparent;white-space:nowrap;">Historie</a>
  </div>
</nav>

  <header>
    <div class="brand">
      <h1>Value Radar</h1>
      <span class="sub">● bets kiezen &amp; exporteren</span>
    </div>
    <p class="tagline">
      Vink aan welke bets je speelt en pas eventueel de inzet aan. Sla promovendus-bets
      over waar je wilt. Eén klik exporteert je keuzes voor het tracking-dashboard.
    </p>
    <div class="meta-row">
      <span><b>data:</b> <span id="gen-date">—</span></span>
      <span><b>drempel:</b> EV &gt; <span id="ev-thr">5</span>%</span>
      <label class="load-btn">
        data laden
        <input type="file" id="file-input" accept=".json,application/json" hidden>
      </label>
    </div>
  </header>

  <div class="batchnote" id="batchnote" hidden>
    <label for="batch-ta">Algemene notitie bij deze batch</label>
    <textarea class="batch-ta" id="batch-ta" placeholder="Bijv. 'Weinig vertrouwen in de O/U-lijnen deze week, inzetten verlaagd na interlandbreak.'"></textarea>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>

  <div class="exportbar" id="exportbar" style="display:none;">
    <div class="exportbar-inner">
      <div class="summary" id="summary">Geen bets geselecteerd</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="log-btn small" id="log-clear" title="Logboek in deze browser wissen">Wissen</button>
        <button class="log-btn" id="log-btn" title="Download het beslissingen-logboek als CSV">Logboek exporteren (.csv)</button>
        <button class="export-btn" id="publish-btn" disabled>Publiceren (picks_data)</button>
      </div>
    </div>
  </div>

<script>
// ── State ───────────────────────────────────────────────────────────────
let DATA = null;
let activeTab = 0;
// selections: bet_id → { played:bool, stake:number, bet:{...}, match:{...}, league }
const SEL = {};

function betId(leagueKey, m, b) {
  // stabiele identiteit zodat settlement later kan matchen
  return `${leagueKey}|${m.home}|${m.away}|${b.market}`;
}

// ── Laden ───────────────────────────────────────────────────────────────
async function boot() {
  try {
    const res = await fetch('dashboard_data.json', { cache:'no-store' });
    if (res.ok) { DATA = await res.json(); initSelections(); render(); return; }
  } catch(e) {}
  renderEmpty();
}
document.getElementById('file-input').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = (ev) => {
    try { DATA = JSON.parse(ev.target.result); activeTab=0; initSelections(); render(); }
    catch { alert('Kon dit bestand niet lezen — is het geldige JSON?'); }
  };
  r.readAsText(f);
});

function initSelections() {
  Object.keys(SEL).forEach(k => delete SEL[k]);
  (DATA.leagues||[]).forEach(lg => (lg.matches||[]).forEach(m => (m.bets||[]).forEach(b => {
    const id = betId(lg.key, m, b);
    // Standaard AANGEVINKT alleen als de bet is AANBEVOLEN (recommended) én er
    // geen promovendus-waarschuwing op de match staat. Getoonde-maar-niet-
    // aanbevolen bets (lagere EV) staan zichtbaar maar uit — jij kiest zelf.
    // Terugval: als 'recommended' ontbreekt (oud databestand), val terug op het
    // oude gedrag (alles aan behalve bij waarschuwing).
    const hasWarn = (m.warnings||[]).length > 0;
    const isRec = (b.recommended !== undefined) ? b.recommended : true;
    SEL[id] = { played: isRec && !hasWarn, stake: b.stake, bet: b, match: m, league: lg.key, leagueLabel: lg.label };
    // Het modelvoorstel, bevroren. De odd-invoer past b.book_odd direct aan,
    // dus we kopiëren de uitgangswaarden hier voor het logboek.
    SEL[id].orig = { played: SEL[id].played, stake: b.stake, book_odd: b.book_odd ?? null, ev_pct: b.ev_pct ?? null };
  })));
  loadNotes();
}

// ── Helpers ─────────────────────────────────────────────────────────────
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':d.toLocaleString('nl-NL',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function fmtGen(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':d.toLocaleString('nl-NL',{dateStyle:'medium',timeStyle:'short'}); }
function pct(p){ return (p*100).toFixed(1)+'%'; }

// ── Render ──────────────────────────────────────────────────────────────
function render() {
  const leagues = (DATA.leagues||[]).filter(l => (l.matches||[]).length);
  document.getElementById('gen-date').textContent = fmtGen(DATA.generated_at);
  document.getElementById('ev-thr').textContent = DATA.ev_threshold_pct ?? 5;

  const tabsEl = document.getElementById('tabs'); tabsEl.innerHTML='';
  leagues.forEach((lg,i) => {
    const betCount = lg.matches.reduce((a,m)=>a+(m.bets||[]).length,0);
    const btn = document.createElement('button');
    btn.className='tab'+(i===activeTab?' active':'');
    btn.innerHTML = `${lg.label}<span class="cnt">${betCount}</span>`;
    btn.onclick = () => { activeTab=i; render(); };
    tabsEl.appendChild(btn);
  });

  const main = document.getElementById('main'); main.innerHTML='';
  const lg = leagues[activeTab];
  if (!lg) { main.innerHTML='<div class="empty"><p>Geen competities in dit bestand.</p></div>'; return; }

  // Wedstrijden chronologisch op speeldatum + tijd. De 'date' is ISO
  // (2026-08-09T12:15:00Z), en ISO-strings sorteren correct als tekst, dus
  // localeCompare volstaat — geen Date-parsing nodig. Wedstrijden zonder datum
  // (mocht dat voorkomen) zakken naar onderen.
  const matches = [...lg.matches].sort((a,b) => {
    const da = a.date || '', db = b.date || '';
    if (!da && !db) return 0;
    if (!da) return 1;            // a zonder datum → naar achteren
    if (!db) return -1;           // b zonder datum → naar achteren
    return da.localeCompare(db);  // vroegste eerst
  });
  matches.forEach(m => main.appendChild(renderMatch(lg, m)));

  document.getElementById('exportbar').style.display = 'block';
  updateSummary();
}

function renderMatch(lg, m) {
  const el = document.createElement('div'); el.className='match';
  const bets = m.bets||[], warns = m.warnings||[];
  let html = `
    <div class="match-head">
      <div>
        <div class="teams">${m.home}<span class="vs">vs</span>${m.away}</div>
        <div class="match-sub">
          <span>1X2 ${pct(m.prob_home)} / ${pct(m.prob_draw)} / ${pct(m.prob_away)}</span>
          <span class="lam">λ ${m.lambda_home} – ${m.lambda_away}</span>
        </div>
      </div>
      <div class="kickoff">${fmtDate(m.date)}</div>
    </div>`;
  if (warns.length) html += `<div class="warns">`+warns.map(w=>`<div class="warn-chip">${w}</div>`).join('')+`</div>`;
  html += whyHTML(lg, m);

  // Bij ontbrekende bookmaker-odds tonen we een informatieve kop, maar we
  // tekenen de bets-tabel evengoed: het model levert dan alle mogelijke bets
  // met hun fair odd (needs_odd=true), zodat je zelf de odd invult en kiest.
  if (!m.has_odds) {
    html += `<div class="no-odds">Nog geen bookmaker-odds — alle opties staan hieronder met hun fair odd. Vul zelf de bookmaker-odd in bij de bets die je speelt.</div>`;
  }

  if (!bets.length) {
    html += `<div class="bets"><div class="bets-empty">${m.has_odds
      ? 'Geen bet boven de EV-drempel voor dit duel.'
      : 'Geen bets beschikbaar voor dit duel.'}</div></div>`;
  } else {
    html += `<div class="bets"><table><thead><tr>
      <th class="l">Bet</th><th>Fair</th><th>Book</th><th>EV</th><th>Inzet</th><th>Speel</th>
    </tr></thead><tbody>` +
    bets.slice().sort((a,b)=>{
      const ra = a.recommended!==undefined?a.recommended:true;
      const rb = b.recommended!==undefined?b.recommended:true;
      if (ra!==rb) return rb - ra;                 // aanbevolen eerst
      // Bets met EV bovenaan (hoogste eerst). Bets zonder odd (ev_pct==null)
      // hebben geen EV om op te sorteren; die groeperen we onderaan en houden
      // we in hun oorspronkelijke volgorde (1X2 eerst, dan O/U-lijnen oplopend).
      const ea = a.ev_pct, eb = b.ev_pct;
      if (ea==null && eb==null) return 0;          // beide zonder odd → volgorde behouden
      if (ea==null) return 1;                      // a zonder odd → naar achteren
      if (eb==null) return -1;                     // b zonder odd → naar achteren
      return eb - ea;                              // beide met EV → hoogste eerst
    }).map(b => {
      const id = betId(lg.key, m, b);
      const s = SEL[id];
      const label = b.market.replace(/^1X2 |^O\/U /,'');
      const typ = b.type==='O/U'?'O/U':'1X2';
      const isRec = (b.recommended!==undefined)?b.recommended:true;
      const needsOdd = b.needs_odd===true;
      const hasEv = s.bet.ev_pct!=null && s.bet.ev_pct!==undefined;
      const evStr = hasEv ? ((s.bet.ev_pct>=0?'+':'') + s.bet.ev_pct.toFixed(1) + '%') : '—';
      const bookVal = (s.bet.book_odd!=null) ? s.bet.book_odd.toFixed(2) : '';
      return `<tr class="${s.played?'':'off'} ${isRec?'':'shown-only'} ${needsOdd?'needs-odd':''} ${wijzigingen(s).length?'changed':''}" data-id="${id}">
        <td class="l"><span class="mkt-type">${typ}</span>${label}${isRec?'<span class="rec-star" title="Aanbevolen">★</span>':''}${needsOdd?'<span class="fill-hint" title="Bookmaker-odd ontbreekt — vul zelf in">✎</span>':''}</td>
        <td>${b.fair_odd.toFixed(2)}</td>
        <td><input class="odd-in" type="number" min="1" step="0.01" value="${bookVal}" placeholder="—" data-odd="${id}"></td>
        <td class="ev ${hasEv&&s.bet.ev_pct<0?'ev-neg':''}" data-ev="${id}">${evStr}</td>
        <td><span class="stake-euro">€</span><input class="stake-in" type="number" min="0" step="0.25" value="${s.stake}" data-stake="${id}"></td>
        <td class="pick"><span class="cbox ${s.played?'on':''}" data-toggle="${id}"></span></td>
      </tr>`;
    }).join('') + `</tbody></table></div>`;
  }
  html += noteHTML(lg, m);
  el.innerHTML = html;
  koppelNotitie(el, lg, m);

  // events
  el.querySelectorAll('[data-toggle]').forEach(cb => {
    cb.onclick = () => {
      const id = cb.getAttribute('data-toggle');
      SEL[id].played = !SEL[id].played;
      cb.classList.toggle('on', SEL[id].played);
      cb.closest('tr').classList.toggle('off', !SEL[id].played);
      markeer(el, lg, m, id);
      updateSummary();
    };
  });
  el.querySelectorAll('[data-stake]').forEach(inp => {
    inp.onchange = () => {
      const id = inp.getAttribute('data-stake');
      const v = parseFloat(inp.value);
      SEL[id].stake = isNaN(v) ? 0 : v;
      markeer(el, lg, m, id);
      updateSummary();
    };
  });
  // book-odd bewerken → EV live herberekenen
  el.querySelectorAll('[data-odd]').forEach(inp => {
    inp.oninput = () => {
      const id = inp.getAttribute('data-odd');
      const odd = parseFloat(inp.value);
      const bet = SEL[id].bet;
      const evCell = el.querySelector(`[data-ev="${id}"]`);
      if (isNaN(odd) || odd <= 1) {
        bet.book_odd = null; bet.ev_pct = null;
        evCell.textContent = '—'; evCell.classList.remove('ev-neg');
      } else {
        bet.book_odd = odd;
        bet.ev_pct = (bet.model_prob * odd - 1) * 100;   // EV = kans × odd − 1
        evCell.textContent = (bet.ev_pct>=0?'+':'') + bet.ev_pct.toFixed(1) + '%';
        evCell.classList.toggle('ev-neg', bet.ev_pct < 0);
      }
      markeer(el, lg, m, id);
      updateSummary();
    };
  });
  return el;
}

// ═══════════════════════════════════════════════════════════════════════════
//  WAAROM DEZE λ's — korte, uitklapbare onderbouwing per wedstrijd.
//  Gebruikt "lambda_factors" uit de export (Football Sim v9.4.5+): per team de
//  basis (competitiegemiddelde) en de vermenigvuldigers die de λ opbouwen.
//  Oudere exports zonder die opbouw krijgen alleen de afgeleide kansen.
// ═══════════════════════════════════════════════════════════════════════════
function nl(n,d){ return (n==null||isNaN(n))?'—':n.toLocaleString('nl-NL',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function p0(p){ return nl(p*100,0)+'%'; }
function relPct(r){ const v=(r-1)*100; return (v>=0?'+':'−')+nl(Math.abs(v),0)+'%'; }
function escT(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nlNums(s){ return String(s||'').replace(/(\d)\.(\d)/g,'$1,$2'); }
function shortName(t){ return String(t).replace(/^(1\.\s*)?(FC|AFC|SC|SV|AS|AC|SS|SSC|US|RC|RCD|CD|CF|OGC|GD|SBV|VfB|VfL|TSG|RB|CA|UD)\s+/i,'').replace(/\s+(FC|AFC|CF|SC|AC|FK|BC|CFC|SAD|1909|1907|1913|1963|04|05)$/i,''); }
function shortLabel(lbl,m){ return String(lbl).split(m.home).join(shortName(m.home)).split(m.away).join(shortName(m.away)); }

function poisGrid(lh,la,max=10){
  const f=[1]; for(let i=1;i<=max;i++) f[i]=f[i-1]*i;
  const P=(k,l)=>Math.exp(-l)*Math.pow(l,k)/f[k];
  const g=[]; for(let h=0;h<=max;h++){ g[h]=[]; for(let a=0;a<=max;a++) g[h][a]=P(h,lh)*P(a,la); }
  return g;
}
function bookOf(m,market){ const b=(m.bets||[]).find(x=>x.market===market); return b&&b.book_odd>1?b.book_odd:null; }
const NEUTRAL=0.005;   // factoren binnen ±0,5% gelden als neutraal
function activeF(side){ return (side.factors||[]).filter(f=>f.mult>0&&Math.abs(f.mult-1)>=NEUTRAL); }
// good = true/false kleurt de factor groen/rood; λ-naam maakt duidelijk waar hij op werkt
function fTag(x,m,good){ return `<span class="fref" title="${escT(nlNums(x.f.detail||''))}">${escT(shortLabel(x.f.label,m))}</span> <span class="${good?'up':'down'}">(λ ${escT(x.t)} ${relPct(x.f.mult)})</span>`; }

function explainMatch(lg,m){
  const lh=+m.lambda_home, la=+m.lambda_away, lt=lh+la;
  const H=shortName(m.home), A=shortName(m.away);
  const F=(m.lambda_factors&&m.lambda_factors.home&&m.lambda_factors.away)?m.lambda_factors:null;

  // Dominantie op basis van winkans
  const ph=m.prob_home, pa=m.prob_away, d=Math.abs(ph-pa);
  const favH=ph>=pa, fav=favH?H:A, pf=favH?ph:pa, pu=favH?pa:ph;
  const lvl = d<0.08?null : d<0.20?'lichte favoriet' : d<0.35?'duidelijke favoriet' : 'grote favoriet';

  // Referentie voor het doelpuntenniveau: competitiegemiddelde uit het model,
  // anders het gemiddelde van de duels in dit bestand.
  let avgT, avgSrc='comp.-gem.';
  if(F&&F.league_avg_total) avgT=+F.league_avg_total;
  else { const ms=lg.matches.filter(x=>x.lambda_home!=null); avgT=ms.reduce((s,x)=>s+ +x.lambda_home+ +x.lambda_away,0)/ms.length; avgSrc='rondegem.'; }
  const r=lt/avgT;
  const goalWord = r>1.12?'doelpuntrijk' : r<0.88?'weinig goals verwacht' : 'gemiddeld qua goals';
  const headline = (lvl?`${fav} ${lvl} (${p0(pf)} tegen ${p0(pu)})`:`Gelijkwaardig duel (${p0(ph)} tegen ${p0(pa)})`)+`, ${goalWord}.`;
  const teaser = `${lvl?`${fav} ${lvl}`:'gelijkwaardig'} · ${nl(lt,1)} goals verwacht`;

  const li=[];
  if(F){
    const fh=activeF(F.home), fa=activeF(F.away);
    // Dominantie: bijdrage aan ln(λ_fav / λ_underdog). Factoren op de λ van de
    // favoriet tellen positief, factoren op de λ van de underdog negatief.
    const dom=[...fh.map(f=>({f,t:H,c:Math.log(f.mult)*(favH?1:-1)})), ...fa.map(f=>({f,t:A,c:Math.log(f.mult)*(favH?-1:1)}))];
    const pro=dom.filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,3);
    const con=dom.filter(x=>x.c<0).sort((a,b)=>a.c-b.c)[0];
    if(lvl&&pro.length){
      li.push(`<b>Waarom ${fav}:</b> ${pro.map(x=>fTag(x,m,true)).join(', ')}.`+
        (con&&Math.abs(con.c)>=0.04?` Tegenwicht: ${fTag(con,m,false)}.`:''));
    } else if(!lvl){
      const top=dom.sort((a,b)=>Math.abs(b.c)-Math.abs(a.c)).slice(0,2);
      if(top.length) li.push(`<b>Weinig verschil:</b> de grootste factoren (${top.map(x=>fTag(x,m,x.c>0===favH)).join(', ')}) heffen elkaar grotendeels op.`);
    }
    // Doelpunten: bijdrage aan ln(totaal) ≈ aandeel van die λ × ln(factor)
    const sh=lh/lt, sa=la/lt, dir=Math.sign(r-1)||1;
    const gl=[...fh.map(f=>({f,t:H,c:sh*Math.log(f.mult)})), ...fa.map(f=>({f,t:A,c:sa*Math.log(f.mult)}))]
      .filter(x=>Math.sign(x.c)===dir).sort((a,b)=>Math.abs(b.c)-Math.abs(a.c)).slice(0,2);
    li.push(`<b>${nl(lt,2)} goals</b> (${relPct(r)} t.o.v. ${avgSrc} ${nl(avgT,2)})`+
      (Math.abs(r-1)>=0.03&&gl.length?`, vooral door ${gl.map(x=>fTag(x,m,x.c>0)).join(' en ')}.`:'.'));
    // Betrouwbaarheid van de basis
    const b=(side,name)=>side.basis?`${name} ${nl(side.basis.weight_this_season*100,0)}% (${nl(side.basis.played,0)} duels)`:null;
    const bb=[b(F.home,H),b(F.away,A)].filter(Boolean);
    if(bb.length) li.push(`Gewicht van dit seizoen in de teamcijfers: ${bb.join(', ')}; de rest komt uit de prior.`);
  } else {
    li.push(`<b>${nl(lt,2)} goals</b> verwacht (${relPct(r)} t.o.v. ${avgSrc} ${nl(avgT,2)}).`);
  }

  // Afgeleide kansen (Poisson-benadering van de λ's)
  const g=poisGrid(lh,la); let best=[0,0,0], o25=0, btts=0;
  g.forEach((row,h)=>row.forEach((p,a)=>{ if(p>best[2]) best=[h,a,p]; if(h+a>2) o25+=p; if(h>0&&a>0) btts+=p; }));
  li.push(`Over 2,5 ${p0(o25)} · beide scoren ${p0(btts)} · meest waarschijnlijk ${best[0]}-${best[1]} (${p0(best[2])}).`);

  // Model vs markt (1X2 zonder marge)
  const oh=bookOf(m,'1X2 '+m.home), od=bookOf(m,'1X2 Gelijkspel'), oa=bookOf(m,'1X2 '+m.away);
  if(oh&&od&&oa){
    const s=1/oh+1/od+1/oa, mh=(1/oh)/s, ma=(1/oa)/s, dh=(ph-mh)*100, da=(pa-ma)*100;
    const [t,dd]=Math.abs(dh)>=Math.abs(da)?[H,dh]:[A,da];
    li.push(`Markt ${p0(mh)} / ${p0(1-mh-ma)} / ${p0(ma)}`+(Math.abs(dd)<2?': dicht op het model.':`: model schat ${t} ${nl(Math.abs(dd),0)} pp ${dd>0?'hoger':'lager'} in.`));
  }

  return {headline,teaser,li,H,A,lh,la,F};
}

function factorChips(m,side,name,lam){
  const f=activeF(side).sort((a,b)=>Math.abs(Math.log(b.mult))-Math.abs(Math.log(a.mult)));
  return `<div class="fac-team">${escT(name)} <span class="lam">λ ${nl(lam,2)}</span>
    <div class="fac-chips"><span class="fchip base" title="Competitiegemiddelde als startpunt">basis ${nl(+side.base,2)}</span>${
      f.map(x=>`<span class="fchip ${x.mult>=1?'up':'down'}" title="${escT(nlNums(x.detail||''))}">${escT(shortLabel(x.label,m))} ${relPct(x.mult)}</span>`).join('')}</div></div>`;
}

function whyHTML(lg,m){
  if(m.lambda_home==null||m.lambda_away==null) return '';
  const e=explainMatch(lg,m);
  const share=e.lh/(e.lh+e.la)*100;
  return `<details class="why">
    <summary><span class="why-q">Waarom deze λ's?</span><span class="why-teaser">${escT(e.teaser)}</span></summary>
    <div class="why-body">
      <div class="why-head">${escT(e.headline)}</div>
      <div class="split" role="img" aria-label="Verdeling verwachte goals: ${escT(e.H)} ${nl(share,0)}%, ${escT(e.A)} ${nl(100-share,0)}%">
        <span class="h" style="width:${share}%">${nl(e.lh,2)}</span><span class="a" style="width:${100-share}%">${nl(e.la,2)}</span></div>
      <div class="split-cap"><span>${escT(e.H)} ${nl(share,0)}% van de verwachte goals</span><span>${escT(e.A)} ${nl(100-share,0)}%</span></div>
      <ul>${e.li.map(x=>`<li${x.startsWith('<span>')?' class="caution"':''}>${x}</li>`).join('')}</ul>
      ${e.F?`<div class="fac">${factorChips(m,e.F.home,e.H,e.lh)}${factorChips(m,e.F.away,e.A,e.la)}</div>
        <div class="why-note">Elke λ = basis × de factoren (neutrale factoren verborgen). Beweeg over een factor voor de onderliggende cijfers.</div>`
      :`<div class="why-note">Deze export bevat nog geen λ-opbouw. Draai Football Sim v9.4.5 of nieuwer om te zien welke factoren de λ's sturen.</div>`}
    </div>
  </details>`;
}

function updateSummary() {
  const played = Object.values(SEL).filter(s => s.played);
  const totalStake = played.reduce((a,s)=>a + (s.stake||0), 0);
  const sumEl = document.getElementById('summary');
  const pub = document.getElementById('publish-btn');
  if (!played.length) {
    sumEl.innerHTML = 'Geen bets geselecteerd';
    pub.disabled = true;
  } else {
    sumEl.innerHTML = `<b>${played.length}</b> bet(s) geselecteerd · totale inzet <span class="amt">€${totalStake.toFixed(2)}</span>`;
    pub.disabled = false;
  }
  const nChg = Object.values(SEL).filter(s => wijzigingen(s).some(w => w !== 'odd_ingevuld')).length;
  if (nChg) sumEl.innerHTML += ` · <span class="chg">${nChg} aanpassing(en) t.o.v. model</span>`;
  const nLog = leesLogboek().length;
  document.getElementById('log-btn').textContent = `Logboek exporteren (.csv)${nLog ? ' · ' + nLog + ' batch' + (nLog>1?'es':'') : ''}`;
}

// ── Export ──────────────────────────────────────────────────────────────
function buildExport() {
  const played = Object.values(SEL).filter(s => s.played && s.stake > 0);
  if (!played.length) return null;
  // controleer of alle gespeelde bets een ingevulde odd hebben
  const missing = played.filter(s => s.bet.book_odd == null || s.bet.book_odd <= 1);
  if (missing.length) {
    const namen = missing.map(s => `${s.match.home}-${s.match.away}: ${s.bet.market}`).join('\n');
    alert('Deze geselecteerde bet(s) hebben nog geen bookmaker-odd ingevuld:\n\n' + namen +
          '\n\nVul de odd in (of vink de bet uit) voordat je publiceert.');
    return null;
  }
  return {
    exported_at: new Date().toISOString(),
    source_generated_at: DATA.generated_at || null,
    bets: played.map(s => ({
      bet_id: betId(s.league, s.match, s.bet),
      league: s.league,
      league_label: s.leagueLabel,
      home: s.match.home,
      away: s.match.away,
      match_date: s.match.date || null,
      market: s.bet.market,
      type: s.bet.type,
      fair_odd: s.bet.fair_odd,
      book_odd: s.bet.book_odd,
      ev_pct: s.bet.ev_pct,
      stake: s.stake,
      bookmaker: s.match.bookmaker || null,
      status: 'open'          // settlement vult dit later: won / lost
    }))
  };
}

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Publiceren met oplopend nummer ─────────────────────────────────────────
// De site onthoudt het laatst gebruikte nummer in de browser-opslag en stelt
// het volgende voor. Je kunt het aanpassen voordat je downloadt. Eén bestand
// picks_data_NNN.json dient voor zowel je Python-script als de weergave-site.
const PICKS_COUNTER_KEY = 'johnspicks:picksCounter:v1';

function getNextPicksNumber() {
  let last = 0;
  try { last = parseInt(localStorage.getItem(PICKS_COUNTER_KEY) || '0', 10) || 0; } catch(e) {}
  return last + 1;
}
function rememberPicksNumber(n) {
  try { localStorage.setItem(PICKS_COUNTER_KEY, String(n)); } catch(e) {}
}

document.getElementById('publish-btn').onclick = () => {
  const out = buildExport();
  if (!out) return;
  const suggested = getNextPicksNumber();
  const answer = prompt(
    'Volgnummer voor dit picks-bestand:\n\n' +
    'De site stelt het volgende nummer voor. Pas aan als je wilt.\n' +
    'Let op: kies geen nummer dat je al gebruikt hebt, anders download je een dubbele.',
    String(suggested)
  );
  if (answer === null) return;                       // geannuleerd
  const n = parseInt(answer, 10);
  if (isNaN(n) || n < 1) { alert('Geen geldig nummer.'); return; }
  const nnn = String(n).padStart(3, '0');
  rememberPicksNumber(n);                             // onthoud het hoogste
  downloadJSON(out, `picks_data_${nnn}.json`);
  legBatchVast(n);                                    // beslissingen → logboek
  updateSummary();
};

// ═══════════════════════════════════════════════════════════════════════════
//  BESLISSINGEN-LOGBOEK
//  Legt per batch vast wat het model voorstelde (dashboard_data) en wat jij er
//  uiteindelijk van maakte (picks_data), plus je redenen. Bedoeld als
//  trainingsdata voor een later meta-model.
//
//  • Notities en tags worden per batch bewaard in de browser, zodat verversen
//    of van tabblad wisselen niets kost.
//  • Bij 'Publiceren' wordt de batch automatisch in het logboek gezet.
//    Opnieuw publiceren van dezelfde batch overschrijft die versie.
//  • 'Logboek exporteren' zet eerst de huidige stand vast en downloadt dan
//    álle batches als één CSV. Bewaar die CSV — de browser-opslag is geen archief.
//  • Opgenomen per batch: elke aanbevolen bet, en elke bet die jij aanraakte
//    (aan/uit, inzet, odd). Onaangeraakte bets zonder odd blijven eruit.
// ═══════════════════════════════════════════════════════════════════════════
const NOTES_KEY_PREFIX = 'johnspicks:notes:v1:';
const LOG_KEY = 'johnspicks:beslissingslog:v1';
// Vaste redenen: één klik, en voor een model beter bruikbaar dan vrije tekst.
const REDEN_TAGS = [
  'blessure/afwezigheid', 'opstelling/rotatie', 'odd bewogen', 'markt wantrouwen',
  'EV te hoog/verdacht', 'promovendus', 'vorm/gevoel', 'motivatie/stand',
  'weer/veld', 'correlatie (zelfde duel)', 'inzet omlaag: risico', 'inzet omhoog: vertrouwen'
];
let NOTES = { batch: '', matches: {} };

function batchId() { return (DATA && DATA.generated_at) || 'onbekend'; }
function matchKey(lgKey, m) { return `${lgKey}|${m.home}|${m.away}`; }
function notitieVan(lgKey, m) {
  const k = matchKey(lgKey, m);
  return NOTES.matches[k] || (NOTES.matches[k] = { note: '', tags: [] });
}
function loadNotes() {
  NOTES = { batch: '', matches: {} };
  try {
    const raw = localStorage.getItem(NOTES_KEY_PREFIX + batchId());
    if (raw) { const o = JSON.parse(raw); NOTES.batch = o.batch || ''; NOTES.matches = o.matches || {}; }
  } catch(e) {}
  const ta = document.getElementById('batch-ta');
  ta.value = NOTES.batch;
  ta.oninput = () => { NOTES.batch = ta.value; saveNotes(); };
  document.getElementById('batchnote').hidden = false;
}
function saveNotes() {
  try { localStorage.setItem(NOTES_KEY_PREFIX + batchId(), JSON.stringify(NOTES)); } catch(e) {}
}

// Wat is er aan deze bet veranderd t.o.v. het modelvoorstel?
function zelfdeGetal(a, b) {
  if (a == null && b == null) return true;
  if (a == null || b == null) return false;
  return Math.abs(a - b) < 0.005;
}
function wijzigingen(s) {
  if (!s || !s.orig) return [];
  const o = s.orig, w = [];
  if (s.played && !o.played) w.push('toegevoegd');
  if (!s.played && o.played) w.push('geschrapt');
  if ((s.played || o.played) && !zelfdeGetal(s.stake, o.stake)) w.push('inzet');
  const nu = s.bet.book_odd ?? null;
  if (!zelfdeGetal(nu, o.book_odd)) w.push(o.book_odd == null ? 'odd_ingevuld' : 'odd_gewijzigd');
  return w;
}

function noteHTML(lg, m) {
  const n = notitieVan(lg.key, m);
  return `<details class="note" data-note="${escT(matchKey(lg.key, m))}">
    <summary><span class="note-q">Beslissing &amp; redenen</span><span class="note-state"></span></summary>
    <div class="note-body">
      <div class="note-tags">${REDEN_TAGS.map(t =>
        `<span class="ntag ${n.tags.includes(t)?'on':''}" data-tag="${escT(t)}">${escT(t)}</span>`).join('')}</div>
      <textarea class="note-ta" placeholder="Waarom speel je dit (niet), of waarom een andere inzet/odd?">${escT(n.note)}</textarea>
      <div class="note-diff"></div>
    </div>
  </details>`;
}
function koppelNotitie(el, lg, m) {
  const n = notitieVan(lg.key, m);
  const box = el.querySelector('details.note');
  if (!box) return;
  box.querySelectorAll('[data-tag]').forEach(t => {
    t.onclick = () => {
      const tag = t.getAttribute('data-tag');
      n.tags = n.tags.includes(tag) ? n.tags.filter(x => x !== tag) : n.tags.concat(tag);
      t.classList.toggle('on', n.tags.includes(tag));
      saveNotes(); verversNotitieStaat(el, lg, m);
    };
  });
  const ta = box.querySelector('.note-ta');
  ta.oninput = () => { n.note = ta.value; saveNotes(); verversNotitieStaat(el, lg, m); };
  verversNotitieStaat(el, lg, m);
}
function betsVanMatch(lg, m) { return (m.bets || []).map(b => SEL[betId(lg.key, m, b)]).filter(Boolean); }
function beschrijf(s) {
  const o = s.orig, w = wijzigingen(s), lbl = s.bet.market;
  const parts = [];
  if (w.includes('toegevoegd')) parts.push('toegevoegd');
  if (w.includes('geschrapt')) parts.push('geschrapt');
  if (w.includes('inzet')) parts.push(`inzet €${(+o.stake||0).toFixed(2)} → €${(+s.stake||0).toFixed(2)}`);
  if (w.includes('odd_gewijzigd')) parts.push(`odd ${o.book_odd.toFixed(2)} → ${s.bet.book_odd==null?'—':s.bet.book_odd.toFixed(2)}`);
  if (w.includes('odd_ingevuld') && s.played) parts.push(`odd ingevuld ${s.bet.book_odd.toFixed(2)}`);
  return parts.length ? `<b>${escT(lbl)}</b>: ${parts.join(', ')}` : '';
}
function verversNotitieStaat(el, lg, m) {
  const box = el.querySelector('details.note'); if (!box) return;
  const n = notitieVan(lg.key, m);
  const regels = betsVanMatch(lg, m).map(beschrijf).filter(Boolean);
  const echteChg = betsVanMatch(lg, m).filter(s => wijzigingen(s).some(w => w !== 'odd_ingevuld')).length;
  const st = box.querySelector('.note-state');
  const bits = [];
  if (echteChg) bits.push(`<span class="chg">${echteChg} aangepast</span>`);
  if (n.tags.length) bits.push(escT(n.tags.join(', ')));
  if (n.note.trim()) bits.push('notitie ✓');
  st.innerHTML = bits.length ? bits.join(' · ') : 'geen aanpassingen';
  st.classList.toggle('has', !!(n.tags.length || n.note.trim()));
  box.querySelector('.note-diff').innerHTML = regels.length
    ? 'Verschil met model — ' + regels.join(' · ')
    : 'Nog geen verschil met het modelvoorstel.';
}
function markeer(el, lg, m, id) {
  const tr = el.querySelector(`tr[data-id="${CSS.escape(id)}"]`);
  if (tr) tr.classList.toggle('changed', wijzigingen(SEL[id]).length > 0);
  verversNotitieStaat(el, lg, m);
}

// ── Logboek-opslag ──
function leesLogboek() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]') || []; } catch(e) { return []; }
}
function schrijfLogboek(log) {
  try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); return true; }
  catch(e) { alert('Kon het logboek niet opslaan in de browser (opslag vol of geblokkeerd). Exporteer de CSV en wis daarna het logboek.'); return false; }
}
function r4(v) { return (v == null || isNaN(v)) ? null : Math.round(v * 10000) / 10000; }

// Maak de rijen van de huidige batch
function batchRijen(picksNr) {
  const loggedAt = new Date().toISOString();
  const rijen = [];
  Object.values(SEL).forEach(s => {
    const b = s.bet, o = s.orig, w = wijzigingen(s);
    const isRec = (b.recommended !== undefined) ? b.recommended : true;
    const aangeraakt = w.length > 0 && !(w.length === 1 && w[0] === 'odd_ingevuld' && !s.played);
    if (!isRec && !o.played && !s.played && !aangeraakt) return;
    const n = notitieVan(s.league, s.match);
    const finalOdd = b.book_odd ?? null;
    rijen.push({
      batch_id: batchId(),
      logged_at: loggedAt,
      picks_nr: picksNr ?? '',
      bet_id: betId(s.league, s.match, b),
      league: s.league,
      home: s.match.home,
      away: s.match.away,
      match_date: s.match.date || '',
      market: b.market,
      type: b.type,
      bookmaker: s.match.bookmaker || '',
      lambda_home: s.match.lambda_home ?? '',
      lambda_away: s.match.lambda_away ?? '',
      model_prob: r4(b.model_prob),
      fair_odd: r4(b.fair_odd),
      recommended: isRec ? 1 : 0,
      had_warning: (s.match.warnings || []).length ? 1 : 0,
      model_played: o.played ? 1 : 0,
      model_stake: o.stake ?? '',
      model_book_odd: r4(o.book_odd),
      model_ev_pct: r4(o.ev_pct),
      final_played: s.played ? 1 : 0,
      final_stake: s.played ? (s.stake ?? 0) : 0,
      final_book_odd: r4(finalOdd),
      final_ev_pct: r4(b.ev_pct),
      stake_diff: r4((s.played ? (+s.stake || 0) : 0) - (o.played ? (+o.stake || 0) : 0)),
      odd_diff: (o.book_odd != null && finalOdd != null) ? r4(finalOdd - o.book_odd) : '',
      changes: w.join('|'),
      tags: n.tags.join('|'),
      match_note: n.note.trim(),
      batch_note: (NOTES.batch || '').trim()
    });
  });
  return rijen;
}
function legBatchVast(picksNr) {
  if (!DATA) return;
  const log = leesLogboek();
  const i = log.findIndex(x => x.batch_id === batchId());
  // publiceer-nummer behouden als je later alleen exporteert
  const nr = picksNr ?? (i >= 0 ? log[i].picks_nr : null);
  const entry = { batch_id: batchId(), picks_nr: nr, saved_at: new Date().toISOString(), rows: batchRijen(nr) };
  if (i >= 0) log[i] = entry; else log.push(entry);
  schrijfLogboek(log);
}

// ── CSV-export ──
const LOG_KOLOMMEN = ['batch_id','logged_at','picks_nr','bet_id','league','home','away','match_date',
  'market','type','bookmaker','lambda_home','lambda_away','model_prob','fair_odd','recommended','had_warning',
  'model_played','model_stake','model_book_odd','model_ev_pct',
  'final_played','final_stake','final_book_odd','final_ev_pct','stake_diff','odd_diff',
  'changes','tags','match_note','batch_note'];
function csvCel(v) {
  if (v == null) return '';
  const t = String(v).replace(/\r?\n/g, ' ');
  return /[",]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
document.getElementById('log-btn').onclick = () => {
  if (!DATA) return;
  legBatchVast(null);                         // huidige stand eerst vastzetten
  const log = leesLogboek();
  const rijen = log.flatMap(e => e.rows || []);
  if (!rijen.length) { alert('Het logboek is nog leeg.'); return; }
  const csv = '\ufeff' + [LOG_KOLOMMEN.join(',')]
    .concat(rijen.map(r => LOG_KOLOMMEN.map(k => csvCel(r[k])).join(','))).join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `beslissingen_log_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  updateSummary();
};
document.getElementById('log-clear').onclick = () => {
  const n = leesLogboek().length;
  if (!n) { alert('Het logboek is al leeg.'); return; }
  if (!confirm(`Het logboek in deze browser bevat ${n} batch(es).\nHeb je de CSV geëxporteerd? Wissen kan niet ongedaan worden.`)) return;
  try { localStorage.removeItem(LOG_KEY); } catch(e) {}
  updateSummary();
};

function renderEmpty() {
  document.getElementById('tabs').innerHTML='';
  document.getElementById('main').innerHTML = `
    <div class="empty">
      <h2>Nog geen data geladen</h2>
      <p>Plaats <code>dashboard_data.json</code> naast dit bestand, of laad het
         handmatig met <b>data laden</b> rechtsboven.</p>
    </div>`;
  document.getElementById('exportbar').style.display='none';
  document.getElementById('batchnote').hidden = true;
}

boot();
