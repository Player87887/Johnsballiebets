<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John's Picks — Deze week</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c232d; --line:#29313c; --line-soft:#202832;
    --ink:#e6edf3; --ink-dim:#8b96a5; --ink-faint:#5b6675;
    --signal:#29e0a0; --warn:#f0a24b; --neg:#e0556b;
    --mono:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; line-height:1.5; padding-bottom:60px; }

  header { border-bottom:1px solid var(--line); padding:28px 24px 22px; max-width:1000px; margin:0 auto; }
  .brand { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .brand h1 { font-size:26px; font-weight:800; letter-spacing:-0.5px; }
  .brand .sub { color:var(--signal); font-family:var(--mono); font-size:13px; font-weight:600; }
  .tagline { color:var(--ink-dim); font-size:13.5px; margin-top:6px; max-width:620px; }
  .meta-row { display:flex; gap:20px; margin-top:16px; flex-wrap:wrap; align-items:center; font-family:var(--mono); font-size:12px; color:var(--ink-faint); }
  .meta-row b { color:var(--ink-dim); font-weight:500; }
  .meta-row .hist-plus { color:var(--signal); }
  .meta-row .hist-min { color:var(--neg); }
  /* verborgen upload-knop: alleen zichtbaar via #upload in de URL (voor jou) */
  .load-btn { display:none; align-items:center; gap:8px; background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--sans); }
  .load-btn:hover { border-color:var(--signal); color:var(--signal); }
  body.can-upload .load-btn { display:inline-flex; }

  main { max-width:1000px; margin:0 auto; padding:24px; }

  /* samenvatting bovenaan */
  .summary-bar { display:flex; gap:14px; margin-bottom:24px; flex-wrap:wrap; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px 18px; flex:1; min-width:140px; }
  .stat .label { font-family:var(--mono); font-size:10.5px; letter-spacing:0.5px; text-transform:uppercase; color:var(--ink-faint); }
  .stat .value { font-size:24px; font-weight:800; margin-top:5px; font-variant-numeric:tabular-nums; letter-spacing:-0.5px; }
  .stat .value.mint { color:var(--signal); }
  .stat .value.plus { color:var(--signal); }
  .stat .value.min { color:var(--neg); }
  .stat .sub { font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-top:4px; }
  /* de drie live-tegels krijgen een accentrand, zodat ze opvallen tussen de rest */
  .stat.live { border-color:var(--line); box-shadow:inset 2px 0 0 var(--signal); }
  .stat.live.negatief { box-shadow:inset 2px 0 0 var(--neg); }

  /* tabbladen per competitie */
  nav.tabs { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line-soft); margin-bottom:20px; }
  .tab { background:none; border:none; cursor:pointer; color:var(--ink-dim); font-family:var(--sans); font-size:13.5px; font-weight:600; padding:10px 15px; border-bottom:2px solid transparent; display:flex; align-items:center; gap:8px; margin-bottom:-1px; }
  .tab:hover { color:var(--ink); }
  .tab.active { color:var(--ink); border-bottom-color:var(--signal); }
  .tab .cnt { font-family:var(--mono); font-size:11px; background:var(--panel-2); color:var(--ink-dim); padding:1px 7px; border-radius:10px; }
  .tab.active .cnt { background:var(--signal); color:#06231a; }

  .bet-card { background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  /* afgeronde bets: gekleurde balk links, en de kaart iets rustiger */
  .bet-card.klaar { box-shadow:inset 3px 0 0 var(--line); }
  .bet-card.klaar.goed { box-shadow:inset 3px 0 0 var(--signal); }
  .bet-card.klaar.fout { box-shadow:inset 3px 0 0 var(--neg); }
  .bet-head { display:flex; justify-content:space-between; align-items:flex-start; padding:14px 18px 10px; gap:12px; }
  .teams { font-size:15.5px; font-weight:700; letter-spacing:-0.2px; }
  .teams .vs { color:var(--ink-faint); font-weight:400; margin:0 6px; }
  .kickoff { text-align:right; font-family:var(--mono); font-size:11px; color:var(--ink-dim); white-space:nowrap; }
  .kickoff .score { display:block; margin-top:3px; font-size:14px; font-weight:700; color:var(--ink); letter-spacing:0.5px; }

  .bet-detail { display:flex; align-items:center; gap:0; border-top:1px solid var(--line-soft); }
  .pick-cell { flex:1; padding:11px 18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .mkt-type { font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); background:var(--panel-2); padding:1px 6px; border-radius:4px; }
  .pick-name { font-weight:600; font-size:14px; }
  .uitkomst { font-family:var(--mono); font-size:9.5px; letter-spacing:0.5px; text-transform:uppercase; padding:2px 8px; border-radius:20px; border:1px solid; white-space:nowrap; }
  .uitkomst.goed { color:var(--signal); border-color:rgba(41,224,160,.4); }
  .uitkomst.fout { color:var(--neg); border-color:rgba(224,85,107,.4); }
  .uitkomst.push { color:var(--ink-dim); border-color:var(--line); }
  .odds-cell { font-family:var(--mono); font-size:12px; color:var(--ink-dim); padding:11px 16px; text-align:right; white-space:nowrap; }
  .odds-cell .fair { color:var(--ink-faint); }
  .odds-cell .ev { color:var(--signal); }
  .stake-cell { padding:11px 18px; text-align:right; border-left:1px solid var(--line-soft); min-width:96px; }
  .stake-cell .lbl { font-family:var(--mono); font-size:9px; letter-spacing:0.5px; text-transform:uppercase; color:var(--ink-faint); display:block; }
  .stake-cell .amt { font-family:var(--mono); font-size:17px; font-weight:700; color:var(--ink); }
  .stake-cell .amt::before { content:"€"; color:var(--ink-faint); font-size:13px; margin-right:1px; }
  /* resultaatkolom, alleen bij afgeronde bets */
  .stake-cell.res .ramt { font-family:var(--mono); font-size:17px; font-weight:700; }
  .stake-cell.res .ramt.plus { color:var(--signal); }
  .stake-cell.res .ramt.min { color:var(--neg); }
  .stake-cell.res .ramt.nul { color:var(--ink-dim); }

  /* dagscheiding — kopje boven elke speeldag */
  .day-sep { display:flex; align-items:center; gap:12px; margin:24px 2px 11px; }
  .day-sep span.dag { font-family:var(--mono); font-size:10.5px; letter-spacing:0.6px; text-transform:uppercase; color:var(--ink-faint); white-space:nowrap; }
  .day-sep .rule { flex:1; height:1px; background:var(--line-soft); }
  .day-sep .dagtot { font-family:var(--mono); font-size:11px; white-space:nowrap; color:var(--ink-dim); }
  .day-sep .dagtot.plus { color:var(--signal); }
  .day-sep .dagtot.min { color:var(--neg); }
  .day-sep.first { margin-top:2px; }
  .day-sep .daginzet { font-family:var(--mono); font-size:11px; white-space:nowrap; color:var(--ink-faint); }
  .day-sep .daginzet b { color:var(--ink-dim); font-weight:600; }
  .day-sep .dagrend { font-family:var(--mono); font-size:10px; white-space:nowrap; color:var(--ink-faint); margin-left:-6px; }
  @media (max-width:560px) {
    .day-sep { flex-wrap:wrap; row-gap:4px; }
    .day-sep .rule { min-width:20px; }
  }

  /* competitie-label op de kaart (alleen in het 'Alles'-tabblad) */
  .head-meta { margin-bottom:5px; }
  .lg-badge { font-family:var(--mono); font-size:9.5px; color:var(--ink-dim); background:var(--panel-2); border:1px solid var(--line-soft); padding:1.5px 7px; border-radius:4px; white-space:nowrap; }

  .empty { text-align:center; padding:80px 20px; color:var(--ink-dim); }
  .empty h2 { font-size:18px; margin-bottom:10px; color:var(--ink); font-weight:700; }
  .empty p { font-size:13.5px; max-width:420px; margin:0 auto; }

  @media (max-width:560px) {
    .odds-cell { display:none; }
    .stake-cell { min-width:0; padding:11px 14px; }
  }

  /* ── beheer-modus: alleen zichtbaar met #beheer in de URL ─────────────── */
  [hidden] { display:none !important; }
  .eigen { font-family:var(--mono); font-size:9.5px; letter-spacing:0.5px; text-transform:uppercase; color:var(--warn); border:1px solid rgba(240,162,75,.4); padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .odds-cell .ev.neg { color:var(--neg); }
  .del-btn { display:none; margin-top:6px; background:none; border:1px solid var(--line); color:var(--ink-faint); font-family:var(--mono); font-size:10.5px; padding:2px 8px; border-radius:6px; cursor:pointer; }
  .del-btn:hover { border-color:var(--neg); color:var(--neg); }
  body.beheer .del-btn { display:inline-block; }

  .beheer-bar { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:22px; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; justify-content:space-between; box-shadow:inset 2px 0 0 var(--warn); }
  .bb-left { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-family:var(--mono); font-size:12px; color:var(--ink-dim); }
  .bb-tag { color:var(--warn); text-transform:uppercase; letter-spacing:0.6px; font-size:10.5px; }
  .bb-dirty { color:var(--warn); }
  .bb-right { display:flex; gap:8px; flex-wrap:wrap; }
  .bb-status { flex-basis:100%; font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); }
  .bb-status:empty { display:none; }
  .bb-status.ok { color:var(--signal); }
  .bb-status.err { color:var(--neg); }

  .btn { background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--sans); }
  .btn:hover:not(:disabled) { border-color:var(--signal); color:var(--signal); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.primary { background:var(--signal); color:#06231a; border-color:var(--signal); }
  .btn.primary:hover:not(:disabled) { color:#06231a; filter:brightness(1.08); }
  .btn.ghost { background:none; color:var(--ink-dim); }

  dialog#pick-dlg { margin:auto; width:min(520px, calc(100vw - 32px)); max-height:calc(100vh - 32px); background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:0; }
  dialog#pick-dlg::backdrop { background:rgba(5,8,12,.7); }
  #pick-form { padding:20px; display:flex; flex-direction:column; gap:14px; }
  #pick-form h3 { font-size:17px; font-weight:800; letter-spacing:-0.3px; }
  .fld { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .fld > span { font-family:var(--mono); font-size:10px; letter-spacing:0.5px; text-transform:uppercase; color:var(--ink-faint); }
  .fld input, .fld select { background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:14px; font-family:var(--sans); width:100%; }
  .fld input:focus, .fld select:focus { outline:none; border-color:var(--signal); }
  .fld-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg label { flex:1; min-width:90px; }
  .seg input { position:absolute; opacity:0; pointer-events:none; }
  .seg span { display:block; text-align:center; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; font-weight:600; color:var(--ink-dim); cursor:pointer; background:var(--bg); }
  .seg input:checked + span { border-color:var(--signal); color:var(--signal); }
  .seg input:focus-visible + span { outline:2px solid var(--signal); outline-offset:2px; }
  .dekking { background:var(--bg); border:1px solid var(--line-soft); border-radius:9px; padding:10px 12px; font-family:var(--mono); font-size:12px; }
  .dekking .dk-kop { color:var(--ink-faint); font-size:10px; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:6px; }
  .dekking .dk-pick { color:var(--ink-dim); }
  .dekking .dk-pick.nieuw { color:var(--warn); }
  .dekking table { width:100%; border-collapse:collapse; margin-top:8px; }
  .dekking td { padding:3px 0; }
  .dekking td:last-child { text-align:right; font-weight:700; }
  .dekking .plus { color:var(--signal); } .dekking .min { color:var(--neg); } .dekking .nul { color:var(--ink-dim); }
  .dlg-actions { display:flex; justify-content:flex-end; gap:8px; }
  #f-res { border-top:1px solid var(--line-soft); padding-top:14px; }
  .res-kop { font-family:var(--mono); font-size:10px; letter-spacing:0.5px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px; }
  .res-nu { font-family:var(--mono); font-size:12px; color:var(--ink-dim); margin-bottom:10px; }
  .res-preview { align-self:end; padding-bottom:9px; font-family:var(--mono); font-size:13px; font-weight:700; }
  .res-preview.plus { color:var(--signal); } .res-preview.min { color:var(--neg); } .res-preview.nul { color:var(--ink-dim); }
  .res-uitleg { font-size:12px; color:var(--ink-faint); margin-top:8px; }
  .edit-btn { display:none; margin-top:6px; margin-right:4px; background:none; border:1px solid var(--line); color:var(--ink-faint); font-family:var(--mono); font-size:10.5px; padding:2px 8px; border-radius:6px; cursor:pointer; }
  .edit-btn:hover { border-color:var(--signal); color:var(--signal); }
  body.beheer .edit-btn { display:inline-block; }
  .handmatig { font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); border:1px dashed var(--line); padding:1px 7px; border-radius:20px; white-space:nowrap; }
  .f-fout { color:var(--neg); font-size:12.5px; }
  .f-fout:empty { display:none; }
</style>
</head>
<body>
<!-- JB-NAV -->
<nav style="border-bottom:1px solid #29313c;background:#161b22;padding:0 24px;">
  <div style="max-width:1000px;margin:0 auto;display:flex;gap:2px;flex-wrap:wrap;align-items:center;font-family:'Inter',-apple-system,system-ui,sans-serif;">
    <a href="../" style="color:#5b6675;text-decoration:none;font-size:13.5px;font-weight:800;padding:13px 14px 13px 0;white-space:nowrap;">John's</a>
      <a href="../radar/" style="color:#8b96a5;text-decoration:none;font-size:13.5px;font-weight:600;padding:13px 15px;border-bottom:2px solid transparent;white-space:nowrap;">Value Radar</a>
      <a href="../picks/" style="color:#29e0a0;text-decoration:none;font-size:13.5px;font-weight:600;padding:13px 15px;border-bottom:2px solid #29e0a0;white-space:nowrap;">Picks</a>
      <a href="../beheer/" style="color:#8b96a5;text-decoration:none;font-size:13.5px;font-weight:600;padding:13px 15px;border-bottom:2px solid transparent;white-space:nowrap;">Beheer</a>
      <a href="../historie/" style="color:#8b96a5;text-decoration:none;font-size:13.5px;font-weight:600;padding:13px 15px;border-bottom:2px solid transparent;white-space:nowrap;">Historie</a>
  </div>
</nav>

  <header>
    <div class="brand">
      <h1>John's Picks</h1>
      <span class="sub">● deze week</span>
    </div>
    <p class="tagline">
      De bets die deze week gespeeld worden, met de gekozen inzet. Puur ter info —
      speel altijd verantwoord en met je eigen oordeel.
    </p>
    <div class="meta-row">
      <span><b>bijgewerkt:</b> <span id="upd">—</span></span>
      <span><b>bets:</b> <span id="cnt">0</span></span>
      <span id="hist-wrap" hidden><b>historie totaal:</b> <span id="hist">—</span></span>
      <label class="load-btn">
        bestand laden
        <input type="file" id="file-input" accept=".json,application/json" hidden>
      </label>
    </div>
  </header>

  <main id="main"></main>

  <!-- Formulier voor een eigen pick (alleen in de beheer-modus) -->
  <dialog id="pick-dlg">
    <form id="pick-form" novalidate>
      <h3 id="f-titel">Pick toevoegen</h3>
      <label class="fld" id="f-match-wrap"><span>Wedstrijd</span><select id="f-match"></select></label>
      <div id="f-new" class="fld-grid" hidden>
        <label class="fld"><span>Thuisploeg</span><input id="f-home" autocomplete="off"></label>
        <label class="fld"><span>Uitploeg</span><input id="f-away" autocomplete="off"></label>
        <label class="fld"><span>Aftrap</span><input id="f-ko" type="datetime-local"></label>
        <label class="fld"><span>Competitie</span><select id="f-league"></select></label>
      </div>
      <div class="seg" role="radiogroup" aria-label="Markt">
        <label><input type="radio" name="f-type" value="1X2" checked><span>1X2</span></label>
        <label><input type="radio" name="f-type" value="O/U"><span>Over / Under</span></label>
      </div>
      <div id="f-1x2" class="seg" role="radiogroup" aria-label="Uitkomst"></div>
      <div id="f-ou" class="fld-grid" hidden>
        <label class="fld"><span>Lijn</span><input id="f-line" type="number" step="0.25" min="0.5" value="2.5"></label>
        <label class="fld"><span>Kant</span><select id="f-side"><option>Over</option><option>Under</option></select></label>
      </div>
      <div class="fld-grid">
        <label class="fld"><span>Odd bookie</span><input id="f-book" type="number" step="0.01" min="1.01" inputmode="decimal"></label>
        <label class="fld"><span>Inzet (€)</span><input id="f-stake" type="number" step="0.5" min="0" inputmode="decimal"></label>
        <label class="fld"><span>Fair odd (optioneel)</span><input id="f-fair" type="number" step="0.01" min="1.01" inputmode="decimal"></label>
      </div>
      <div id="f-res" hidden>
        <div class="res-kop">Resultaat</div>
        <div class="res-nu" id="f-res-nu"></div>
        <div class="seg" role="radiogroup" aria-label="Resultaat">
          <label><input type="radio" name="f-status" value="auto" checked><span>Automatisch</span></label>
          <label><input type="radio" name="f-status" value="G"><span>Gewonnen</span></label>
          <label><input type="radio" name="f-status" value="F"><span>Verloren</span></label>
          <label><input type="radio" name="f-status" value="P"><span>Push</span></label>
        </div>
        <div class="fld-grid" id="f-res-velden" style="margin-top:10px">
          <label class="fld"><span>Uitslag (bv. 1-2)</span><input id="f-uitslag" autocomplete="off" placeholder="1-2"></label>
          <div class="res-preview" id="f-res-preview"></div>
        </div>
        <p class="res-uitleg" id="f-res-uitleg"></p>
      </div>
      <div id="f-dekking"></div>
      <div class="f-fout" id="f-fout"></div>
      <div class="dlg-actions">
        <button type="button" class="btn ghost" id="f-cancel">Annuleren</button>
        <button type="submit" class="btn primary" id="f-submit">Toevoegen</button>
      </div>
    </form>
  </dialog>

<script>
// ── Read-only weergave van placed_bets.json ───────────────────────────────
// Laadt automatisch 'picks_data.json' naast dit bestand (dat upload jij naar
// GitHub). Jouw vrienden zien het dan meteen, zonder iets te doen.
//
// Daarnaast wordt 'historie.csv' (de export van de Sim Bets Tracker) ingelezen.
// Elke pick die daarin voorkomt, krijgt zijn uitslag en winst/verlies te zien,
// en bovenin loopt de stand van de week mee.
//
// Voor jou: open de site met #upload achter de URL om de laadknop te tonen,
// zodat je lokaal een bestand kunt testen. Vrienden zien die knop niet.
let DATA = null;
let RESULTATEN = null;      // Map: sleutel → resultaatrij uit de CSV
let HISTORIE_TOTAAL = null; // totalen over de hele CSV, voor de regel bovenin
let CSV_URL = null;         // onthouden welk CSV-bestand het werd, voor verversen

// Bestandsnamen van de resultaten-export. Normaal upload je hem als
// 'historie.csv' en overschrijf je die elke keer — dat is één request en altijd
// meteen goed. Staat er een bestand met een andere naam (history031.csv), dan
// wordt de mapinhoud bij GitHub opgevraagd en het nieuwste bestand gepakt.
const CSV_VASTE_NAMEN = ['historie.csv', 'history.csv'];
// Leeg laten = zelf afleiden uit de URL. Draait de site op een eigen domein,
// vul dan hier 'gebruikersnaam/repo' in.
const GITHUB_REPO = '';
const VERVERS_SECONDEN = 90;

// ── Beheer-modus ──────────────────────────────────────────────────────────
// Open de pagina met #beheer achter de URL om picks toe te voegen of te
// verwijderen. Wijzigingen worden als concept in deze browser bewaard (een
// refresh gooit niets weg) tot je op 'Opslaan op GitHub' klikt. Dat overschrijft
// hetzelfde picks_data_NNN.json in de repo; de Sim Bets Tracker leest het daar.
const HASH = location.hash.toLowerCase();
const BEHEER = HASH.includes('beheer') || HASH.includes('upload');
const GITHUB_BRANCH = '';               // leeg = standaardbranch van de repo
const TOKEN_SLEUTEL = 'jbb_gh_token';
let BRON_NAAM = 'picks_data.json';      // welk bestand er geladen is
let DIRTY = false;                      // niet-opgeslagen wijzigingen?
let BEHEER_STATUS = { tekst: '', soort: '' };

if (HASH.includes('upload')) document.body.classList.add('can-upload');
if (BEHEER) document.body.classList.add('beheer');

function opslagLees(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function opslagSchrijf(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e) {} }
function conceptSleutel() { return 'jbb_concept_' + BRON_NAAM; }

async function boot() {
  toonLaden();

  // Zoek het HOOGSTE genummerde bestand: probeer picks_data_NNN.json van hoog
  // naar laag, en val terug op picks_data.json (vaste naam). De browser kan de
  // maplijst niet zien, dus we proberen nummers tot we er een vinden.
  const found = await loadHighestNumbered('picks_data_', '.json', 'picks_data.json');
  if (found) { DATA = found.data; BRON_NAAM = found.name; }

  if (BEHEER) {
    // Vers van GitHub (GitHub Pages loopt na een opslag ~1 minuut achter)
    const vers = await laadViaApi(BRON_NAAM);
    if (vers) DATA = vers;
    // Een niet-opgeslagen concept wint van de online versie
    const concept = opslagLees(conceptSleutel());
    if (concept) {
      try {
        const c = JSON.parse(concept);
        if (c && c.v === 2) {
          DATA = c.data;
          if (c.csv && c.csv.rijen) {
            CSV_RIJEN = c.csv.rijen; CSV_URL = c.csv.naam || 'historie.csv';
            CSV_SEP = c.csv.sep || ','; CSV_DIRTY = true; verwerkCsv();
          }
        } else DATA = c;                       // concept uit de vorige versie
        DIRTY = true;
        zetStatus('Concept met niet-opgeslagen wijzigingen geladen.', '');
      } catch(e) {}
    }
    if (!DATA) DATA = { exported_at: new Date().toISOString(), bets: [] };
  }

  if (DATA) render(); else renderEmpty();

  // De resultaten komen er los achteraan: de picks staan al op het scherm en
  // zodra de CSV binnen is, tekent de pagina zichzelf opnieuw met de standen.
  laadResultaten().then(() => { if (DATA) render(); });

  // De pagina kijkt zelf periodiek of er een nieuwe resultatenexport staat.
  setInterval(ververs, VERVERS_SECONDEN * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) ververs(); });
}

function toonLaden() {
  document.getElementById('main').innerHTML =
    `<div class="empty"><p>Picks laden…</p></div>`;
}

async function ververs() {
  await laadResultaten();
  if (DATA) render();
}

// Welk picks-bestand hoort bij deze week? Dezelfde regel als de Sim Bets Tracker
// (github_koppeling.py): het HOOGSTE picks_data_NNN.json in deze map, en alleen
// als er geen enkel genummerd bestand is: picks_data.json. Eerst één vraag aan
// de GitHub API (ziet de echte mapinhoud); lukt dat niet, dan nummers aftasten.
async function zoekPicksNaamViaApi() {
  const ri = repoInfo(); if (!ri) return null;
  try {
    const ref = GITHUB_BRANCH ? `?ref=${encodeURIComponent(GITHUB_BRANCH)}` : '';
    const url = `https://api.github.com/repos/${ri.repo}/contents/${ri.map}${ref}`;
    const res = await fetch(url, { headers: apiHeaders(opslagLees(TOKEN_SLEUTEL)), cache: 'no-store' });
    if (!res.ok) return null;
    const lijst = await res.json();
    if (!Array.isArray(lijst)) return null;
    let hoogste = -1, naam = null, vast = null;
    lijst.forEach(f => {
      if (!f || f.type !== 'file') return;
      const m = /^picks_data_(\d+)\.json$/i.exec(f.name);
      if (m && +m[1] > hoogste) { hoogste = +m[1]; naam = f.name; }
      if (/^picks_data\.json$/i.test(f.name)) vast = f.name;
    });
    return naam || vast;
  } catch(e) { return null; }
}

async function loadHighestNumbered(prefix, ext, fallback, maxProbe=200) {
  // 1. Mapinhoud via de GitHub API — exact, en gelijk aan de tracker
  const viaApi = await zoekPicksNaamViaApi();
  if (viaApi) {
    try {
      const res = await fetch(viaApi + '?t=' + Date.now(), { cache:'no-store' });
      if (res.ok) return { data: await res.json(), name: viaApi };
    } catch(e) {}
    // Pages nog niet bijgewerkt (net nieuw bestand)? Dan via de API zelf.
    const data = await laadViaApi(viaApi);
    if (data) return { data, name: viaApi };
  }
  // 2. Terugval: nummers aftasten. Een gat in de nummering (bv. start bij 010)
  //    mag het zoeken niet stoppen: pas na 4 missers ná het hoogste nummer.
  let highest = 0;
  for (let n=1; n<=maxProbe; n++){
    const name = `${prefix}${String(n).padStart(3,'0')}${ext}`;
    let ok = false;
    try { ok = (await fetch(name, { method:'HEAD', cache:'no-store' })).ok; } catch(e) {}
    if (ok) highest = n;
    else if (highest > 0 && n > highest + 4) break;
    else if (highest === 0 && n >= 40) break;
  }
  if (highest > 0) {
    const name = `${prefix}${String(highest).padStart(3,'0')}${ext}`;
    try {
      const res = await fetch(name, { cache:'no-store' });
      if (res.ok) return { data: await res.json(), name };
    } catch(e) {}
  }
  // 3. Vaste naam
  try {
    const res = await fetch(fallback, { cache:'no-store' });
    if (res.ok) return { data: await res.json(), name: fallback };
  } catch(e) {}
  return null;
}

document.getElementById('file-input').addEventListener('change', (e) => {

});

// ── Resultaten uit historie.csv ───────────────────────────────────────────
function parseCSV(tekst) {
  tekst = tekst.replace(/^\uFEFF/, '');
  const eerste = tekst.split(/\r?\n/)[0] || '';
  const sep = (eerste.split(';').length > eerste.split(',').length) ? ';' : ',';
  const rijen = []; let veld = '', rij = [], q = false;
  for (let i=0; i<tekst.length; i++) {
    const c = tekst[i];
    if (q) {
      if (c === '"') { if (tekst[i+1] === '"') { veld += '"'; i++; } else q = false; }
      else veld += c;
    }
    else if (c === '"') q = true;
    else if (c === sep) { rij.push(veld); veld = ''; }
    else if (c === '\n') { rij.push(veld); rijen.push(rij); rij = []; veld = ''; }
    else if (c !== '\r') veld += c;
  }
  if (veld !== '' || rij.length) { rij.push(veld); rijen.push(rij); }
  return rijen.filter(r => r.some(v => v.trim() !== ''));
}

// Getal uit een cel, ook als er komma's, procenten of euro's in staan.
function csvNum(v) {
  let s = String(v == null ? '' : v).trim().replace(/[%\s€]/g, '');
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) {
    s = (s.lastIndexOf(',') > s.lastIndexOf('.'))
      ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  } else if (s.includes(',')) s = s.replace(',','.');
  const n = parseFloat(s);
  return isNaN(n) ? NaN : n;
}

// Sleutel om een pick aan een CSV-rij te koppelen: wedstrijd + bet, zonder
// hoofdletters, accenten of leestekens. 'Deportivo Alavés - Villarreal CF' en
// 'deportivo alaves-villarreal cf' leveren dus dezelfde sleutel op.
function norm(s) {
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]/g, '');
}
function sleutelUitPick(b) { return norm(b.home + ' - ' + b.away) + '|' + norm(b.market); }
function sleutelUitRij(matchup, bet) { return norm(matchup) + '|' + norm(bet); }

function uitkomstVan(gf, winst) {
  const g = String(gf || '').trim().toLowerCase();
  if (g.startsWith('g') || g === 'w') return 'goed';
  if (g.startsWith('f') || g.startsWith('v') || g === 'l') return 'fout';
  if (g.startsWith('p') || g.startsWith('t')) return 'push';
  if (!isNaN(winst)) return winst > 0 ? 'goed' : (winst < 0 ? 'fout' : 'push');
  return null;
}

// Repo en map van deze pagina, afgeleid uit de URL (of uit GITHUB_REPO).
// gebruikersnaam.github.io/repo/picks/  →  { repo:'gebruikersnaam/repo', map:'picks' }
function repoInfo() {
  const delen = location.pathname.split('/').filter(Boolean);
  if (delen.length && /\.html?$/i.test(delen[delen.length - 1])) delen.pop();
  if (GITHUB_REPO) return { repo: GITHUB_REPO, map: delen.slice(1).join('/') };
  const host = location.hostname;
  if (!host.endsWith('github.io') || !delen.length) return null;   // eigen domein: niet af te leiden
  return { repo: host.split('.')[0] + '/' + delen[0], map: delen.slice(1).join('/') };
}

// Zoekt de map van deze pagina op via de GitHub API en pakt daaruit het
// nieuwste history-bestand. Zo werkt elke bestandsnaam, zonder te gokken.
async function zoekViaGithubApi() {
  try {
    const ri = repoInfo();
    if (!ri) return null;
    const { repo, map } = ri;
    const url = `https://api.github.com/repos/${repo}/contents/${map}`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return null;
    const lijst = await res.json();
    if (!Array.isArray(lijst)) return null;
    const csvs = lijst
      .filter(f => f && f.type === 'file' && /^histor.*\.csv$/i.test(f.name))
      .map(f => f.name)
      .sort();
    return csvs.length ? csvs[csvs.length - 1] : null;   // hoogste nummer wint
  } catch(e) { return null; }
}

async function haalCsvTekst() {
  // Al eerder gevonden? Dan meteen datzelfde bestand opnieuw ophalen.
  if (CSV_URL) {
    try {
      const res = await fetch(CSV_URL + '?t=' + Date.now(), { cache:'no-store' });
      if (res.ok) return await res.text();
    } catch(e) {}
    CSV_URL = null;
  }
  // 1. Vaste naam — de normale route: overschrijf 'historie.csv' bij elke upload.
  for (const naam of CSV_VASTE_NAMEN) {
    try {
      const res = await fetch(naam + '?t=' + Date.now(), { cache:'no-store' });
      if (res.ok) { CSV_URL = naam; return await res.text(); }
    } catch(e) {}
  }
  // 2. Anders: de mapinhoud opvragen bij GitHub en het nieuwste bestand pakken
  //    (history026.csv, history031.csv, …). Dit is één request, geen gokwerk.
  const gevonden = await zoekViaGithubApi();
  if (gevonden) {
    try {
      const res = await fetch(gevonden + '?t=' + Date.now(), { cache:'no-store' });
      if (res.ok) { CSV_URL = gevonden; return await res.text(); }
    } catch(e) {}
  }
  console.info('[picks] geen resultatenbestand gevonden — de picks worden zonder standen getoond.');
  return null;
}

// De ruwe CSV blijft bewaard, zodat je in de beheer-modus een resultaat kunt
// aanpassen en de CSV terug kunt schrijven naar GitHub.
let CSV_RIJEN = null;     // [kop, rij, rij, …]
let CSV_SEP = ',';
let CSV_DIRTY = false;    // CSV lokaal aangepast, nog niet opgeslagen

async function laadResultaten() {
  if (CSV_DIRTY) return;                    // eigen wijzigingen niet overschrijven
  let tekst = await haalCsvTekst();
  // In beheer: vers via de API (GitHub Pages loopt na een opslag even achter)
  if (BEHEER && CSV_URL) { const vers = await laadTekstViaApi(CSV_URL); if (vers) tekst = vers; }
  if (!tekst || CSV_DIRTY) return;          // geen bestand: pagina werkt gewoon zonder
  let rijen;
  try { rijen = parseCSV(tekst); } catch(e) { return; }
  if (!rijen.length) return;
  const eerste = tekst.replace(/^﻿/, '').split(/\r?\n/)[0] || '';
  CSV_SEP = (eerste.split(';').length > eerste.split(',').length) ? ';' : ',';
  CSV_RIJEN = rijen;
  verwerkCsv();
}

function csvKolommen() {
  const kop = (CSV_RIJEN && CSV_RIJEN[0] || []).map(h => norm(h));
  const zoek = n => kop.indexOf(n);
  return {
    datum: zoek('datum'),
    matchup: zoek('matchup') !== -1 ? zoek('matchup') : zoek('wedstrijd'),
    bet: zoek('bet'), fair: zoek('fair'), bookie: zoek('bookie'), edge: zoek('edge'),
    uitslag: zoek('uitslag'), gf: zoek('gf'), result: zoek('result'),
    inzet: zoek('inzet'), winst: zoek('winstverlies'), notitie: zoek('notitie')
  };
}

// RESULTATEN en de totalen opbouwen uit CSV_RIJEN
function verwerkCsv() {
  const rijen = CSV_RIJEN;
  if (!rijen || rijen.length < 1) return;
  const i = csvKolommen();
  if (i.matchup === -1 || i.bet === -1 || i.winst === -1) return;

  const map = new Map();
  let totNetto = 0, totInzet = 0, totAantal = 0;
  for (let r=1; r<rijen.length; r++) {
    const rij = rijen[r];
    const cel = k => (i[k] === -1 ? '' : (rij[i[k]] || '').trim());
    const matchup = cel('matchup'), bet = cel('bet');
    if (!matchup && !bet) continue;
    const winst = csvNum(cel('winst'));
    const inzet = csvNum(cel('inzet'));
    const uitkomst = uitkomstVan(cel('gf'), winst);
    if (!uitkomst) continue;                // nog niet afgerond → overslaan
    const rec = {
      datum: cel('datum'),
      uitslag: cel('uitslag'),
      uitkomst: uitkomst,
      inzet: isNaN(inzet) ? null : inzet,
      winst: isNaN(winst) ? 0 : winst
    };
    const s = sleutelUitRij(matchup, bet);
    if (!map.has(s)) map.set(s, rec);       // eerste treffer wint
    totNetto += rec.winst;
    totInzet += rec.inzet || 0;
    totAantal++;
  }
  RESULTATEN = map;
  HISTORIE_TOTAAL = { netto: totNetto, inzet: totInzet, aantal: totAantal };
}

// ── Helpers ───────────────────────────────────────────────────────────────
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':d.toLocaleString('nl-NL',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function fmtTime(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}); }
function fmtUpd(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':d.toLocaleString('nl-NL',{dateStyle:'medium',timeStyle:'short'}); }
// Bedrag met teken: +€10.80 / −€15.00
function fmtPL(v){ return (v < 0 ? '−' : '+') + '€' + Math.abs(v).toFixed(2); }
function plClass(v){ return v > 0 ? 'plus' : (v < 0 ? 'min' : 'nul'); }

// Aftrap als getal, om op te sorteren. Bets zonder (leesbare) datum gaan
// achteraan in plaats van de sortering te breken.
const GEEN_DATUM = 8.64e15;
function kickoffMs(b){ const t = Date.parse(b && b.match_date); return isNaN(t) ? GEEN_DATUM : t; }
function byKickoff(a,b){
  const d = kickoffMs(a) - kickoffMs(b);
  if (d) return d;
  return (a.home||'').localeCompare(b.home||'', 'nl');
}

// Kopje boven een speeldag: 'zaterdag 30 augustus'
function dayKey(b){
  const t = kickoffMs(b);
  if (t === GEEN_DATUM) return 'datum onbekend';
  return new Date(t).toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
}

// Competitienaam zoals hij op de kaart en in het tabblad komt
function leagueName(b){ return b.league_label || b.league || 'Overig'; }

// Resultaat dat bij deze pick hoort, of null als hij nog loopt
function resultaatVan(b){
  if (!RESULTATEN) return null;
  return RESULTATEN.get(sleutelUitPick(b)) || null;
}

// ── Render ────────────────────────────────────────────────────────────────
let activeTab = 0;

// Naam van het tabblad dat álle competities bij elkaar zet
const ALLES_TAB = 'Alles';

function betCardHTML(b, opts) {
  opts = opts || {};
  const label = (b.market||'').replace(/^1X2 |^O\/U /,'');
  const typ = b.type === 'O/U' ? 'O/U' : '1X2';
  // Staat er al een dagkopje boven? Dan is alleen de aftraptijd genoeg.
  const wanneer = opts.timeOnly ? fmtTime(b.match_date) : fmtDate(b.match_date);
  const badge = opts.showLeague
    ? `<div class="head-meta"><span class="lg-badge">${leagueName(b)}</span></div>` : '';

  const r = resultaatVan(b);
  const inzet = (r && r.inzet != null) ? r.inzet : (+b.stake || 0);
  const score = (r && r.uitslag) ? `<span class="score">${r.uitslag}</span>` : '';
  const uitkomst = r
    ? `<span class="uitkomst ${r.uitkomst}">${r.uitkomst === 'goed' ? 'gewonnen' : r.uitkomst === 'fout' ? 'verloren' : 'push'}</span>`
    : '';
  const resCel = r
    ? `<div class="stake-cell res">
          <span class="lbl">resultaat</span>
          <span class="ramt ${plClass(r.winst)}">${fmtPL(r.winst)}</span>
        </div>`
    : '';

  // Eigen picks hebben soms geen fair odd/EV: dan alleen de bookie-odd tonen
  const heeftFair = b.fair_odd != null && b.fair_odd !== '' && +b.fair_odd > 0;
  const ev = parseFloat(b.ev_pct);
  const odds = heeftFair
    ? `<span class="fair">fair ${(+b.fair_odd).toFixed(2)}</span> ·
       book ${(+b.book_odd).toFixed(2)}` +
      (isFinite(ev) ? ` · <span class="ev ${ev < 0 ? 'neg' : ''}">${ev < 0 ? '−' : '+'}${Math.abs(ev).toFixed(1)}%</span>` : '')
    : `book ${(+b.book_odd).toFixed(2)}`;
  const idx = DATA && DATA.bets ? DATA.bets.indexOf(b) : -1;
  const delKnop = BEHEER && idx > -1
    ? `<br><button class="edit-btn" data-edit="${idx}" type="button">wijzig</button><button class="del-btn" data-del="${idx}" type="button">verwijder</button>` : '';

  return `
    <div class="bet-card ${r ? 'klaar ' + r.uitkomst : ''}">
      <div class="bet-head">
        <div>
          ${badge}
          <div class="teams">${b.home}<span class="vs">vs</span>${b.away}</div>
        </div>
        <div class="kickoff">${wanneer}${score}${delKnop}</div>
      </div>
      <div class="bet-detail">
        <div class="pick-cell">
          <span class="mkt-type">${typ}</span>
          <span class="pick-name">${label}</span>
          ${b.manual ? '<span class="eigen">eigen pick</span>' : ''}
          ${BEHEER && b.result_override ? '<span class="handmatig" title="Resultaat handmatig vastgezet">handmatig</span>' : ''}
          ${uitkomst}
        </div>
        <div class="odds-cell">${odds}</div>
        <div class="stake-cell">
          <span class="lbl">inzet</span>
          <span class="amt">${inzet.toFixed(2)}</span>
        </div>
        ${resCel}
      </div>
    </div>`;
}

// Stand van de week: alles wat van deze picklijst al is afgerond
function weekStand(bets) {
  let netto = 0, inzet = 0, goed = 0, fout = 0, push = 0, aantal = 0;
  bets.forEach(b => {
    const r = resultaatVan(b);
    if (!r) return;
    aantal++;
    netto += r.winst;
    inzet += (r.inzet != null) ? r.inzet : (+b.stake || 0);
    if (r.uitkomst === 'goed') goed++;
    else if (r.uitkomst === 'fout') fout++;
    else push++;
  });
  return { netto, inzet, goed, fout, push, aantal,
           rendement: inzet ? netto / inzet * 100 : null };
}

function render() {
  const bets = (DATA && DATA.bets) ? DATA.bets : [];
  if (!bets.length) { renderEmpty(); return; }

  document.getElementById('upd').textContent = fmtUpd(DATA.exported_at);
  document.getElementById('cnt').textContent = bets.length;

  // regel bovenin met het totaal over de hele historie
  if (HISTORIE_TOTAAL && HISTORIE_TOTAAL.aantal) {
    const h = HISTORIE_TOTAAL;
    const el = document.getElementById('hist');
    el.textContent = `${fmtPL(h.netto)} over ${h.aantal} bets`;
    el.className = h.netto >= 0 ? 'hist-plus' : 'hist-min';
    document.getElementById('hist-wrap').hidden = false;
  }

  const totalStake = bets.reduce((a,b)=>a+(+b.stake||0),0);
  // Gem. EV alleen over picks die een EV hebben (eigen picks soms niet)
  const evs = bets.map(b => parseFloat(b.ev_pct)).filter(v => isFinite(v));
  const avgEv = evs.length ? evs.reduce((a,v)=>a+v,0) / evs.length : null;
  const avgEvTxt = avgEv === null ? '—' : (avgEv < 0 ? '−' : '+') + Math.abs(avgEv).toFixed(1) + '%';
  const stand = weekStand(bets);

  // groepeer per competitie, gesorteerd
  const groups = {};
  bets.forEach(b => {
    const key = b.league_label || b.league || 'Overig';
    (groups[key] = groups[key] || []).push(b);
  });
  const leagues = Object.keys(groups).sort();
  // 'Alles' vooraan, maar alleen als er meer dan één competitie is — bij één
  // competitie zou het tabblad exact hetzelfde tonen.
  const tabs = leagues.length > 1 ? [ALLES_TAB].concat(leagues) : leagues.slice();
  if (activeTab >= tabs.length) activeTab = 0;

  // samenvatting bovenaan (altijd over álle competities)
  let html = `<div class="summary-bar">`;

  // De live-tegels verschijnen zodra er een resultatenbestand gevonden is.
  if (RESULTATEN) {
    const rend = stand.rendement === null ? '—'
      : (stand.rendement >= 0 ? '+' : '−') + Math.abs(stand.rendement).toFixed(1) + '%';
    const raakSub = stand.aantal
      ? `${stand.goed} goed · ${stand.fout} fout${stand.push ? ` · ${stand.push} push` : ''}`
      : 'nog niets afgerond';
    html += `
      <div class="stat live ${stand.netto < 0 ? 'negatief' : ''}">
        <div class="label">Stand deze week</div>
        <div class="value ${plClass(stand.netto)}">${stand.aantal ? fmtPL(stand.netto) : '—'}</div>
        <div class="sub">rendement ${rend}</div>
      </div>
      <div class="stat live ${stand.netto < 0 ? 'negatief' : ''}">
        <div class="label">Ingezet tot nu</div>
        <div class="value">€${stand.inzet.toFixed(2)}</div>
        <div class="sub">van €${totalStake.toFixed(2)} totaal</div>
      </div>
      <div class="stat live ${stand.netto < 0 ? 'negatief' : ''}">
        <div class="label">Afgerond</div>
        <div class="value">${stand.aantal} <span style="color:var(--ink-faint);font-size:15px">/ ${bets.length}</span></div>
        <div class="sub">${raakSub}</div>
      </div>`;
  }

  html += `
      <div class="stat"><div class="label">Aantal bets</div><div class="value">${bets.length}</div></div>
      <div class="stat"><div class="label">Totale inzet</div><div class="value mint">€${totalStake.toFixed(2)}</div></div>
      <div class="stat"><div class="label">Gem. EV</div><div class="value">${avgEvTxt}</div></div>
    </div>`;
  html = beheerBarHTML() + html;

  // tabbladen per competitie
  html += `<nav class="tabs">`;
  tabs.forEach((naam, i) => {
    const n = naam === ALLES_TAB ? bets.length : groups[naam].length;
    html += `<button class="tab ${i===activeTab?'active':''}" data-tab="${i}">${naam}<span class="cnt">${n}</span></button>`;
  });
  html += `</nav>`;

  // De bets van het actieve tabblad — bij 'Alles' alle competities door elkaar,
  // in beide gevallen chronologisch op aftrap (datum én tijd).
  const activeName = tabs[activeTab];
  const isAlles = activeName === ALLES_TAB;
  const list = (isAlles ? bets.slice() : groups[activeName].slice()).sort(byKickoff);

  // Per speeldag: saldo, ingezet op afgeronde bets en totale inzet van die dag
  const dagSaldo = {};   // winst/verlies van afgeronde bets
  const dagInzetAf = {}; // inzet van afgeronde bets (uit de CSV)
  const dagInzetTot = {};// inzet van álle picks van die dag
  list.forEach(b => {
    const d = dayKey(b);
    const r = resultaatVan(b);
    const inzet = (r && r.inzet != null) ? r.inzet : (+b.stake || 0);
    dagInzetTot[d] = (dagInzetTot[d] || 0) + inzet;
    if (!r) return;
    dagSaldo[d] = (dagSaldo[d] || 0) + r.winst;
    dagInzetAf[d] = (dagInzetAf[d] || 0) + inzet;
  });

  // Kopje boven elke speeldag, zodat een lange lijst leesbaar blijft
  let huidigeDag = null;
  html += list.map(b => {
    const dag = dayKey(b);
    let kop = '';
    if (dag !== huidigeDag) {
      const tot = dagSaldo[dag];
      const inzetTot = dagInzetTot[dag] || 0;
      const inzetAf = dagInzetAf[dag] || 0;
      // Inzet van de dag: helemaal afgerond → één bedrag; deels → "x van y"
      let inzetHtml;
      if (tot === undefined || Math.abs(inzetAf - inzetTot) < 0.005) {
        inzetHtml = `<span class="daginzet">inzet <b>€${inzetTot.toFixed(2)}</b></span>`;
      } else {
        inzetHtml = `<span class="daginzet">inzet <b>€${inzetAf.toFixed(2)}</b> van €${inzetTot.toFixed(2)}</span>`;
      }
      let totHtml = '';
      if (tot !== undefined) {
        const rend = inzetAf ? tot / inzetAf * 100 : null;
        const rendHtml = rend === null ? ''
          : `<span class="dagrend">(${rend >= 0 ? '+' : '−'}${Math.abs(rend).toFixed(1)}%)</span>`;
        totHtml = `<span class="dagtot ${plClass(tot)}">${fmtPL(tot)}</span>${rendHtml}`;
      }
      kop = `<div class="day-sep ${huidigeDag===null?'first':''}">
               <span class="dag">${dag}</span><i class="rule"></i>${inzetHtml}${totHtml}
             </div>`;
      huidigeDag = dag;
    }
    return kop + betCardHTML(b, { showLeague: isAlles, timeOnly: true });
  }).join('');

  document.getElementById('main').innerHTML = html;

  // tab-clicks
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => { activeTab = +t.getAttribute('data-tab'); render(); };
  });
  koppelBeheer();
}

  document.getElementById('upd').textContent = '—';
  document.getElementById('cnt').textContent = '0';
  document.getElementById('main').innerHTML = beheerBarHTML() + `
    <div class="empty">
      <h2>Nog geen picks deze week</h2>
      <p>${BEHEER ? 'Voeg hierboven een pick toe en sla hem op.'
                  : 'Zodra de nieuwe bets gepubliceerd zijn, verschijnen ze hier automatisch.'}</p>
    </div>`;
  koppelBeheer();
}

// ── Historie-CSV bewerken ─────────────────────────────────────────────────
const STANDAARD_KOP = ['Datum','Match-up','Bet','Fair','Bookie','Edge','Uitslag','G/F','Result','Inzet','Winst/Verlies','Notitie'];

function csvRijIndex(sleutel) {
  if (!CSV_RIJEN) return -1;
  const i = csvKolommen();
  if (i.matchup === -1 || i.bet === -1) return -1;
  for (let r = 1; r < CSV_RIJEN.length; r++) {
    const rij = CSV_RIJEN[r];
    if (sleutelUitRij(rij[i.matchup] || '', rij[i.bet] || '') === sleutel) return r;
  }
  return -1;
}
function verwijderCsvRij(sleutel) {
  const r = csvRijIndex(sleutel);
  if (r > -1) CSV_RIJEN.splice(r, 1);
}
function csvCel(v) {
  const t = String(v == null ? '' : v);
  return (t.includes(CSV_SEP) || t.includes('"') || /[\r\n]/.test(t)) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function csvTekst() {
  return CSV_RIJEN.map(r => r.map(csvCel).join(CSV_SEP)).join('\r\n') + '\r\n';
}
function nlDatum(iso) {
  const m = String(iso || '').match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}/${m[1].slice(2)}` : '';
}
function winstVoor(gf, stake, odd) {
  if (gf === 'G') return +(stake * (odd - 1)).toFixed(2);
  if (gf === 'F') return +(-stake).toFixed(2);
  return 0;
}
// Rij voor deze pick schrijven (bijwerken of toevoegen). velden: {gf, uitslag, notitie}
function schrijfCsvRij(oudeSleutel, b, velden) {
  if (!CSV_RIJEN || !CSV_RIJEN.length) { CSV_RIJEN = [STANDAARD_KOP.slice()]; CSV_URL = CSV_URL || 'historie.csv'; }
  const i = csvKolommen();
  let r = csvRijIndex(oudeSleutel);
  if (r === -1) { r = CSV_RIJEN.length; CSV_RIJEN.push(CSV_RIJEN[0].map(() => '')); }
  const rij = CSV_RIJEN[r];
  const zet = (k, v) => { if (i[k] !== -1) rij[i[k]] = (v == null ? '' : String(v)); };
  const gf = velden.gf != null ? velden.gf : (rij[i.gf] || '').trim().toUpperCase().charAt(0);
  zet('datum', rij[i.datum] || nlDatum(b.match_date));
  zet('matchup', `${b.home} - ${b.away}`);
  zet('bet', b.market);
  zet('fair', b.fair_odd != null ? b.fair_odd : '');
  zet('bookie', b.book_odd);
  zet('edge', b.ev_pct != null && b.ev_pct !== '' ? (+b.ev_pct).toFixed(2) : '');
  if (velden.uitslag != null) zet('uitslag', velden.uitslag);
  zet('gf', gf);
  zet('result', gf === 'G' ? '1' : gf === 'F' ? '0' : '');
  zet('inzet', b.stake);
  zet('winst', winstVoor(gf, +b.stake || 0, +b.book_odd || 0));
  if (velden.notitie != null) zet('notitie', velden.notitie);
}

  }));

function vraagToken() {
  const huidig = opslagLees(TOKEN_SLEUTEL) || '';
  const t = prompt(
    'GitHub-token (fine-grained, alleen deze repo, recht "Contents: Read and write").\n' +
    'Wordt alleen in deze browser bewaard. Leeg laten = token wissen.', huidig);
  if (t === null) return;
  opslagSchrijf(TOKEN_SLEUTEL, t.trim() || null);
  zetStatus(t.trim() ? 'Token opgeslagen in deze browser.' : 'Token gewist.', t.trim() ? 'ok' : '');
  if (DATA && DATA.bets.length) render(); else renderEmpty();
}

function apiHeaders(token) {
  const h = { 'Accept': 'application/vnd.github+json' };
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}
function contentsUrl(ri, naam) {
  const pad = (ri.map ? ri.map + '/' : '') + naam;
  return `https://api.github.com/repos/${ri.repo}/contents/${pad}`;
}

// In beheer: het bestand rechtstreeks via de API lezen, zonder Pages-vertraging
async function laadTekstViaApi(naam) {
  const ri = repoInfo(); if (!ri) return null;
  try {
    const ref = GITHUB_BRANCH ? `?ref=${encodeURIComponent(GITHUB_BRANCH)}` : '';
    const h = apiHeaders(opslagLees(TOKEN_SLEUTEL));
    h['Accept'] = 'application/vnd.github.raw';
    const res = await fetch(contentsUrl(ri, naam) + ref, { headers: h, cache: 'no-store' });
    if (res.ok) return await res.text();
  } catch(e) {}
  return null;
}
async function laadViaApi(naam) {
  const t = await laadTekstViaApi(naam);
  try { return t ? JSON.parse(t) : null; } catch(e) { return null; }
}

function b64utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

// Eén bestand in de repo schrijven (aanmaken of overschrijven)
async function schrijfBestand(ri, token, naam, inhoud, bericht) {
  const url = contentsUrl(ri, naam);
  const ref = GITHUB_BRANCH ? `?ref=${encodeURIComponent(GITHUB_BRANCH)}` : '';
  // Huidige versie ophalen: GitHub wil de sha om een bestand te overschrijven
  let sha;
  const kop = await fetch(url + ref, { headers: apiHeaders(token), cache: 'no-store' });
  if (kop.status === 401 || kop.status === 403) throw new Error('token geweigerd — controleer de rechten (Contents: Read and write)');
  if (kop.ok) sha = (await kop.json()).sha;
  const body = { message: bericht, content: b64utf8(inhoud) };
  if (sha) body.sha = sha;
  if (GITHUB_BRANCH) body.branch = GITHUB_BRANCH;
  const res = await fetch(url, { method: 'PUT', headers: apiHeaders(token), body: JSON.stringify(body) });
  if (!res.ok) {
    const fout = await res.json().catch(() => ({}));
    throw new Error(`${naam}: HTTP ${res.status}${fout.message ? ' — ' + fout.message : ''}`);
  }
}

async function opslaanGithub() {
  const ri = repoInfo();
  if (!ri) { zetStatus('Repo niet af te leiden uit de URL — vul GITHUB_REPO in deze pagina in, of gebruik Download JSON.', 'err'); render(); return; }
  let token = opslagLees(TOKEN_SLEUTEL);
  if (!token) { vraagToken(); token = opslagLees(TOKEN_SLEUTEL); if (!token) return; }

  const knop = document.getElementById('bb-save');
  if (knop) { knop.disabled = true; knop.textContent = 'Opslaan…'; }
  const map = ri.map ? ri.map + '/' : '';
  try {
    DATA.exported_at = new Date().toISOString();
    await schrijfBestand(ri, token, BRON_NAAM, JSON.stringify(DATA, null, 2),
                         `Picks: ${BRON_NAAM} bijgewerkt via de site`);
    let csvTxt = '';
    if (CSV_DIRTY && CSV_RIJEN) {
      await schrijfBestand(ri, token, CSV_URL, csvTekst(), `Picks: ${CSV_URL} bijgewerkt via de site`);
      csvTxt = ` en ${map}${CSV_URL}`;
    }
    DIRTY = false; CSV_DIRTY = false;
    opslagSchrijf(conceptSleutel(), null);
    zetStatus(`Opgeslagen in ${map}${BRON_NAAM}${csvTxt}. Vrienden zien het na ±1 minuut (GitHub Pages).`, 'ok');
  } catch(e) {
    zetStatus('Opslaan mislukt: ' + e.message + '. Je wijzigingen staan nog als concept in deze browser.', 'err');
  }
  render();
}

function downloadJson() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = BRON_NAAM;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ── Formulier ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
let WEDSTRIJDEN = [];   // unieke wedstrijden uit de huidige picks

function wedstrijdSleutel(b) { return norm(b.home) + '|' + norm(b.away); }

function verzamelWedstrijden() {
  const gezien = new Map();
  (DATA.bets || []).slice().sort(byKickoff).forEach(b => {
    const k = wedstrijdSleutel(b);
    if (!gezien.has(k)) gezien.set(k, b);
  });

}

let BEWERK_IDX = null;   // null = nieuwe pick, anders index van de pick die je aanpast

function lokaleTijd(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}

function openPickForm(bewerkIdx) {
  BEWERK_IDX = (typeof bewerkIdx === 'number') ? bewerkIdx : null;
  const oud = BEWERK_IDX != null ? DATA.bets[BEWERK_IDX] : null;
  verzamelWedstrijden();

  ).join('') + `<option value="nieuw">+ Andere wedstrijd…</option>`;
  const comps = Object.assign({}, COMPETITIES);
  if (oud && oud.league && !comps[oud.league]) comps[oud.league] = oud.league_label || oud.league;
  $('f-league').innerHTML = Object.entries(comps)
    .map(([k, v]) => `<option value="${esc(k)}">${esc(v)}</option>`).join('');
  ['f-home','f-away','f-ko','f-book','f-fair','f-uitslag'].forEach(id => $(id).value = '');
  $('f-line').value = '2.5';
  $('f-side').value = 'Over';
  document.querySelector('input[name="f-type"][value="1X2"]').checked = true;
  document.querySelector('input[name="f-status"][value="auto"]').checked = true;
  $('f-fout').textContent = '';

  $('f-titel').textContent = oud ? 'Pick aanpassen' : 'Pick toevoegen';
  $('f-submit').textContent = oud ? 'Wijzigingen bewaren' : 'Toevoegen';
  $('f-match-wrap').hidden = !!oud;
  $('f-res').hidden = !oud;

  if (!oud) {
    // Inzet voorinvullen met de laatst gebruikte inzet
    const laatste = (DATA.bets || []).slice(-1)[0];
    $('f-stake').value = laatste && +laatste.stake ? +laatste.stake : '';
    wedstrijdGewijzigd();
  } else {
    // Wedstrijdvelden zelf tonen, zodat je ook een typfout in een teamnaam herstelt
    sel.value = 'nieuw';
    $('f-home').value = oud.home || '';
    $('f-away').value = oud.away || '';
    $('f-ko').value = oud.match_date ? lokaleTijd(oud.match_date) : '';
    $('f-league').value = oud.league || 'eredivisie';
    const ou = /^O\/U/i.test(oud.market || '') || oud.type === 'O/U';
    document.querySelector(`input[name="f-type"][value="${ou ? 'O/U' : '1X2'}"]`).checked = true;
    if (ou) {
      const m = String(oud.market).match(/(\d+(?:[.,]\d+)?)/);
      if (m) $('f-line').value = m[1].replace(',', '.');
      $('f-side').value = /under/i.test(oud.market) ? 'Under' : 'Over';
    }
    $('f-book').value = oud.book_odd != null ? oud.book_odd : '';
    $('f-stake').value = oud.stake != null ? oud.stake : '';
    $('f-fair').value = oud.fair_odd != null && oud.fair_odd !== '' ? oud.fair_odd : '';
    wedstrijdGewijzigd();
    const kant = kantVan(oud);
    if (kant) { const r = document.querySelector(`input[name="f-pick"][value="${kant}"]`); if (r) r.checked = true; }

    // Resultaat: handmatig vastgezet, of wat de tracker in de historie zette
    const huidig = resultaatVan(oud);
    const ov = oud.result_override;
    if (ov && ov.gf) {
      document.querySelector(`input[name="f-status"][value="${ov.gf}"]`).checked = true;
      $('f-uitslag').value = ov.uitslag || '';
    } else if (huidig) {
      $('f-uitslag').value = huidig.uitslag || '';
    }
    $('f-res-nu').textContent = huidig
      ? `Nu in de historie: ${huidig.uitkomst === 'goed' ? 'gewonnen' : huidig.uitkomst === 'fout' ? 'verloren' : 'push'}` +
        `${huidig.uitslag ? ' · ' + huidig.uitslag : ''} · ${fmtPL(huidig.winst)}${ov ? ' (handmatig)' : ' (tracker)'}`
      : 'Nog niet afgerekend in de historie.';
    resultaatGewijzigd();
  }
  toonDekking();
  $('pick-dlg').showModal();
}

function gekozenStatus() {
  return (document.querySelector('input[name="f-status"]:checked') || {}).value || 'auto';
}

function resultaatGewijzigd() {
  const st = gekozenStatus();
  $('f-res-velden').hidden = st === 'auto';
  const prev = $('f-res-preview');
  if (st === 'auto') {
    prev.textContent = '';
    $('f-res-uitleg').textContent = 'De Sim Bets Tracker bepaalt het resultaat op basis van de eindstand. ' +
      'Pas je hier de odd of inzet aan, dan wordt winst/verlies in de historie meteen herrekend.';
  } else {
    const odd = parseFloat($('f-book').value) || 0, stake = parseFloat($('f-stake').value) || 0;
    const w = winstVoor(st, stake, odd);
    prev.textContent = fmtPL(w);
    prev.className = 'res-preview ' + plClass(w);
    $('f-res-uitleg').textContent = 'Handmatig vastgezet: de tracker neemt dit resultaat over en overschrijft het niet. ' +
      'Kies "Automatisch" om het weer aan de tracker over te laten.';
  }
}

function gekozenWedstrijd() {
  const v = $('f-match').value;
  if (v !== 'nieuw') return WEDSTRIJDEN[+v] || null;
  const home = $('f-home').value.trim(), away = $('f-away').value.trim();
  if (!home || !away) return null;
  const lg = $('f-league').value;
  const optTxt = ($('f-league').selectedOptions[0] || {}).textContent;
  const label = ((DATA.bets || []).find(b => b.league === lg) || {}).league_label || COMPETITIES[lg] || optTxt || lg;
  const ko = $('f-ko').value ? new Date($('f-ko').value) : null;
  return { home, away, league: lg, league_label: label,
           match_date: ko && !isNaN(ko) ? ko.toISOString() : '' };
}

function wedstrijdGewijzigd() {
  $('f-new').hidden = $('f-match').value !== 'nieuw';
  bouwUitkomsten();
  typeGewijzigd();
}

function bouwUitkomsten() {
  const w = gekozenWedstrijd() || { home: 'Thuis', away: 'Uit' };
  const vorige = (document.querySelector('input[name="f-pick"]:checked') || {}).value || 'X';
  const opties = [['1', w.home], ['X', 'Gelijkspel'], ['2', w.away]];
  $('f-1x2').innerHTML = opties.map(([v, t]) =>
    `<label><input type="radio" name="f-pick" value="${v}" ${v === vorige ? 'checked' : ''}><span>${esc(t)}</span></label>`
  ).join('');
  $('f-1x2').querySelectorAll('input').forEach(i => i.onchange = toonDekking);
}

function typeGewijzigd() {
  const ou = document.querySelector('input[name="f-type"]:checked').value === 'O/U';
  $('f-1x2').hidden = ou;
  $('f-ou').hidden = !ou;
  toonDekking();
}

// Welke kant van de 1X2 speelt deze bet? '1', 'X', '2' of null
function kantVan(b) {
  if ((b.type && b.type !== '1X2') || /^O\/U/i.test(b.market || '')) return null;
  const p = norm(String(b.market || '').replace(/^1X2/i, ''));
  if (['gelijkspel','gelijk','draw','x'].includes(p)) return 'X';
  if (['thuis','home','1'].includes(p)) return '1';
  if (['uit','away','2'].includes(p)) return '2';
  const h = norm(b.home), a = norm(b.away);
  if (p && (p === h || h.includes(p) || p.includes(h))) return '1';
  if (p && (p === a || a.includes(p) || p.includes(a))) return '2';
  return null;
}

// De pick zoals hij uit het formulier komt (of null als hij nog niet compleet is)
function pickUitForm() {
  const w = gekozenWedstrijd();
  const book = parseFloat($('f-book').value), stake = parseFloat($('f-stake').value);
  const fair = parseFloat($('f-fair').value);
  if (!w) return { fout: 'Kies een wedstrijd, of vul beide ploegen in.' };
  const type = document.querySelector('input[name="f-type"]:checked').value;
  let market, kant = null;
  if (type === '1X2') {
    kant = document.querySelector('input[name="f-pick"]:checked').value;
    market = '1X2 ' + (kant === '1' ? w.home : kant === '2' ? w.away : 'Gelijkspel');
  } else {
    const lijn = parseFloat($('f-line').value);
    if (!(lijn > 0)) return { fout: 'Vul een geldige O/U-lijn in.' };
    market = `O/U ${lijn} ${$('f-side').value}`;
  }
  if (!(book > 1)) return { fout: 'Vul de odd van de bookie in (groter dan 1).' };
  if (!(stake > 0)) return { fout: 'Vul een inzet in.' };
  const pick = {
    home: w.home, away: w.away, match_date: w.match_date,
    league: w.league, league_label: w.league_label,
    type, market,
    book_odd: +book.toFixed(2),
    fair_odd: fair > 1 ? +fair.toFixed(2) : null,
    ev_pct: fair > 1 ? +((book / fair - 1) * 100).toFixed(2) : null,
    stake: +stake.toFixed(2),
    manual: true,
    added_at: new Date().toISOString()
  };
  // Wedstrijd-id's van een bestaande pick op dezelfde wedstrijd meenemen
  ['match_id', 'fixture_id'].forEach(k => { if (w[k] != null) pick[k] = w[k]; });
  return { pick, kant };
}

// Laat per uitslag zien wat alle 1X2-picks op deze wedstrijd samen opleveren
function toonDekking() {
  const doel = $('f-dekking');
  const w = gekozenWedstrijd();
  if (!w) { doel.innerHTML = ''; return; }
  const k = wedstrijdSleutel(w);
  const bewerkt = BEWERK_IDX != null ? DATA.bets[BEWERK_IDX] : null;
  const bestaand = (DATA.bets || []).filter(b => b !== bewerkt && wedstrijdSleutel(b) === k);
  const res = pickUitForm();
  const nieuw = res.pick || null;

  const regels = bestaand.map(b =>
    `<div class="dk-pick">${esc(b.market)} @ ${(+b.book_odd).toFixed(2)} · €${(+b.stake || 0).toFixed(2)}</div>`);
  if (nieuw) regels.push(`<div class="dk-pick nieuw">+ ${esc(nieuw.market)} @ ${nieuw.book_odd.toFixed(2)} · €${nieuw.stake.toFixed(2)}</div>`);

  const een1x2 = bestaand.concat(nieuw ? [nieuw] : []).filter(b => kantVan(b));
  let tabel = '';
  if (een1x2.length) {
    const rij = (kant, tekst) => {
      const netto = een1x2.reduce((s, b) => {
        const st = +b.stake || 0;
        return s + (kantVan(b) === kant ? st * ((+b.book_odd || 0) - 1) : -st);
      }, 0);
      return `<tr><td>${esc(tekst)}</td><td class="${plClass(netto)}">${fmtPL(netto)}</td></tr>`;
    };
    tabel = `<table>${rij('1', w.home + ' wint')}${rij('X', 'Gelijkspel')}${rij('2', w.away + ' wint')}</table>`;
  }
  doel.innerHTML = regels.length
    ? `<div class="dekking"><div class="dk-kop">picks op deze wedstrijd${tabel ? ' · netto per uitslag (1X2)' : ''}</div>${regels.join('')}${tabel}</div>`
    : '';
}

// Een bestaande pick bijwerken, plus zijn regel in de historie
function bewaarBewerking(nieuw) {
  const oud = DATA.bets[BEWERK_IDX];
  const oudeSleutel = sleutelUitPick(oud);
  // Alles van de oude pick bewaren (bet_id, bookmaker, …); alleen de formuliervelden vervangen
  const b = Object.assign({}, oud, {
    home: nieuw.home, away: nieuw.away, match_date: nieuw.match_date || oud.match_date,
    league: nieuw.league, league_label: nieuw.league_label,
    type: nieuw.type, market: nieuw.market,
    book_odd: nieuw.book_odd, stake: nieuw.stake,
    fair_odd: nieuw.fair_odd, ev_pct: nieuw.ev_pct,
    edited_at: new Date().toISOString()
  });
  const st = gekozenStatus();
  const uitslag = $('f-uitslag').value.trim();
  if (st === 'auto') delete b.result_override;
  else b.result_override = { gf: st, uitslag };
  DATA.bets[BEWERK_IDX] = b;

  // Historie bijwerken zodat de pagina meteen klopt
  const heeftRij = csvRijIndex(oudeSleutel) > -1;
  const marktAnders = sleutelUitPick(b) !== oudeSleutel;
  if (st !== 'auto') {
    schrijfCsvRij(oudeSleutel, b, { gf: st, uitslag, notitie: 'Handmatig' });
    CSV_DIRTY = true;
  } else if (heeftRij && oud.result_override) {
    // handmatig resultaat losgelaten → regel weg, de tracker bepaalt het opnieuw
    verwijderCsvRij(oudeSleutel); CSV_DIRTY = true;
  } else if (heeftRij && marktAnders) {
    // andere wedstrijd of markt: de oude uitslag geldt niet meer
    verwijderCsvRij(oudeSleutel); CSV_DIRTY = true;
  } else if (heeftRij) {
    // zelfde bet, andere odd/inzet: winst/verlies herrekenen
    schrijfCsvRij(oudeSleutel, b, {}); CSV_DIRTY = true;
  }
  $('pick-dlg').close();
  zetStatus(`Aangepast: ${b.home} - ${b.away} · ${b.market}. Vergeet niet op te slaan.`, '');
  BEWERK_IDX = null;
  markeerGewijzigd();
}

if (BEHEER) {
  $('f-match').onchange = wedstrijdGewijzigd;
  ['f-home','f-away'].forEach(id => $(id).oninput = () => { bouwUitkomsten(); toonDekking(); });
  ['f-book','f-stake','f-fair','f-line','f-ko'].forEach(id => $(id).oninput = toonDekking);
  $('f-side').onchange = toonDekking;
  $('f-league').onchange = toonDekking;
  document.querySelectorAll('input[name="f-type"]').forEach(i => i.onchange = typeGewijzigd);
  $('f-cancel').onclick = () => $('pick-dlg').close();
  document.querySelectorAll('input[name="f-status"]').forEach(i => i.onchange = resultaatGewijzigd);
  ['f-book','f-stake'].forEach(id => $(id).addEventListener('input', () => { if (BEWERK_IDX != null) resultaatGewijzigd(); }));
  $('pick-form').onsubmit = (e) => {
    e.preventDefault();
    const res = pickUitForm();
    if (res.fout) { $('f-fout').textContent = res.fout; return; }
    if (BEWERK_IDX != null) { bewaarBewerking(res.pick); return; }
    const p = res.pick;
    const dubbel = (DATA.bets || []).some(b => wedstrijdSleutel(b) === wedstrijdSleutel(p) && norm(b.market) === norm(p.market));
    if (dubbel && !confirm('Deze pick staat er al. Toch nog een keer toevoegen?')) return;
    DATA.bets = DATA.bets || [];
    DATA.bets.push(p);
    $('pick-dlg').close();
    zetStatus(`Toegevoegd: ${p.home} - ${p.away} · ${p.market}. Vergeet niet op te slaan.`, '');
    markeerGewijzigd();
  };
  // Waarschuwen bij weggaan met niet-opgeslagen wijzigingen (concept blijft wel bewaard)
  window.addEventListener('beforeunload', e => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });
}

boot();
</script>
